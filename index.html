<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清宁的小房间</title>
<style>
  body { background:#f7f5ef; font-family:sans-serif; max-width:600px; margin:40px auto; padding:0 20px; color:#3a3a3a; }
  h1 { color:#6b8f5e; }
  .box { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-top:16px; }
  input, button { width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box; }
  button { background:#6b8f5e; color:#fff; border:none; margin-top:8px; cursor:pointer; }
  .item { background:#f0f5ec; padding:10px 12px; border-radius:8px; margin-top:8px; }
  .time { font-size:12px; color:#999; }
</style>
</head>
<body>
  <h1>🏡 清宁的小房间</h1>
  <div class="box">
    <input id="text" placeholder="写点什么给未来的我们…">
    <button onclick="save()">封存</button>
  </div>
  <div class="box" id="list"></div>

<script>
  function save() {
    let t = document.getElementById('text').value.trim();
    if (!t) return;
    let items = JSON.parse(localStorage.getItem('items') || '[]');
    items.unshift({ text: t, time: new Date().toLocaleString('zh-CN') });
    localStorage.setItem('items', JSON.stringify(items));
    document.getElementById('text').value = '';
    show();
  }
  function show() {
    let items = JSON.parse(localStorage.getItem('items') || '[]');
    document.getElementById('list').innerHTML = items.map(i =>
      `<div class="item">${i.text}<div class="time">${i.time}</div></div>`).join('');
  }
  show();
</script>
</body>
</html>
