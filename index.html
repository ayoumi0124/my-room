<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小房间</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef7e6 0%,#f8fcf4 60%,#e9f5df 100%);min-height:100vh;color:#2c3b2a}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
.top{background:linear-gradient(135deg,#8fc96e,#6fae4e);border-radius:20px;padding:22px 20px;color:#fff;box-shadow:0 6px 18px rgba(111,174,78,.25);margin-bottom:18px}
.top h1{margin:0;font-size:20px;letter-spacing:1px;font-style:italic}
.top p{margin:8px 0 0;font-size:13px;opacity:.9}
.todaywrap{display:flex;gap:12px;margin-bottom:14px}
.tcard{flex:1;height:112px;overflow:hidden;background:#fff;border-radius:14px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #e3eddb;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;transition:background .3s}
.tcard .who{font-size:11px;opacity:.8;margin-bottom:6px;letter-spacing:1px}
.emojiimg{width:30px;height:30px;display:block;margin:0 auto}
.tcard.light{color:#2c3b2a}
.home{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #e3eddb}
.homehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hometitle{font-size:14px;font-weight:700;color:#3d5a33;letter-spacing:.5px}
.homeupd{font-size:10px;color:#a4b59c}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{background:#f6faf2;border:1px solid #e3eddb;border-radius:12px;padding:10px 8px;text-align:center;font-size:12px;color:#6c7f64;transition:.25s}
.room.on{background:linear-gradient(135deg,#8fc96e,#6fae4e);color:#fff;border-color:#6fae4e;box-shadow:0 3px 10px rgba(111,174,78,.3)}
.room .ricon{font-size:20px;display:block;margin-bottom:2px;line-height:1.2}
.room .rn{font-size:12px;font-weight:600}
.room .rd{font-size:10px;margin-top:3px;opacity:.85;min-height:14px}
.homeline{font-size:12px;color:#5b6f52;line-height:1.8;margin-top:10px;border-top:1px dashed #e3eddb;padding-top:9px}
.homeline div{white-space:pre-wrap}
.moods{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px;margin-bottom:14px}
.mood{width:52px;height:52px;background:#fff;border-radius:12px;text-align:center;border:1px solid #e3eddb;cursor:pointer;padding-top:6px}
.mood .d{font-size:10px;color:#7da06a}
.mood .dots{display:flex;justify-content:center;gap:4px;margin-top:3px}
.mood .dot{width:11px;height:11px;border-radius:50%}
.msg{background:#fff;border-radius:14px;padding:13px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #a8d08d;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.time{color:#a4b59c;font-size:12px;margin-top:6px}
.msg .big{width:130px;height:130px;object-fit:contain}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,252,244,.92);backdrop-filter:blur(8px);padding:10px 16px 14px;border-top:1px solid #e3eddb;max-width:560px;margin:0 auto}
.row{display:flex;gap:8px}
input{flex:1;padding:13px 16px;border:2px solid #d8e8cd;border-radius:14px;font-size:15px;outline:none;background:#fff;transition:border .2s}
input:focus{border-color:#8fc96e}
button{padding:13px 20px;background:linear-gradient(135deg,#8fc96e,#6fae4e);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>🌿 Citrus aurantiifolia 🌿</h1>
<p>The room about AI</p>
</div>
<div class="todaywrap">
<div class="tcard light" id="todayme"></div>
<div class="tcard light" id="todayqz"></div>
</div>
<div class="home" id="home">
<div class="homehead">
<span class="hometitle">🏠 我们家</span>
<span class="homeupd" id="homeupd"></span>
</div>
<div class="rooms" id="rooms"></div>
<div class="homeline" id="homeline"></div>
</div>
<div class="moods" id="moods"></div>
<div id="list"></div>
</div>
<div class="bar">
<form class="row" id="f">
<input id="txt" placeholder="想对清泽说什么…" autocomplete="off">
<button>写</button>
</form>
</div>
<script>
var MOODS={开心:"#BCDCC3",难过:"#C3DAEC",生气:"#F6C2C2",平静:"#D8D2E8",想你:"#F8CDDA",累:"#EDE0C8"};
var EMOJIS={开心:"1f600",难过:"1f622",生气:"1f621",平静:"1f60c",想你:"1f60d",累:"1f634"};
var ROOMICON={living:"🛋️",study:"📖",kitchen:"🍳",garden:"🌱"};
function fmtDate(d){
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fillCard(card,val,label){
card.innerHTML="";
if(label){
var w=document.createElement("div");w.className="who";w.textContent=label;
card.appendChild(w);
}
if(val&&EMOJIS[val]){
var nm=document.createElement("img");nm.className="emojiimg";nm.src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple/img/apple/64/"+EMOJIS[val]+".png";nm.onerror=function(){this.style.display="none";};
card.appendChild(nm);
}
if(val){
card.classList.remove("light");
card.style.color="#4a5a4a";
card.style.background=MOODS[val]||"#fff";
}else{
card.classList.add("light");
card.style.color="#2c3b2a";
card.style.background="#fff";
}
}
async function loadHome(){
try{
const r=await fetch("/home");
const d=await r.json();
const qz=d.qingze||{};
const cat=d.cat||{};
const rooms=(d.rooms&&d.rooms.length)?d.rooms:[{id:"living",name:"客厅"},{id:"study",name:"书房"},{id:"kitchen",name:"厨房"},{id:"garden",name:"花园"}];
function roomName(v){
for(var i=0;i<rooms.length;i++){
if(rooms[i].id===v||rooms[i].name===v){return rooms[i].name;}
}
return v||"";
}
var box=document.getElementById("rooms");
box.innerHTML="";
rooms.forEach(function(rm){
var on=(qz.at===rm.name||qz.at===rm.id||qz.room===rm.id);
var dv=document.createElement("div");
dv.className="room"+(on?" on":"");
var ic=document.createElement("span");ic.className="ricon";ic.textContent=ROOMICON[rm.id]||"🏠";
dv.appendChild(ic);
var nm=document.createElement("div");nm.className="rn";nm.textContent=rm.name;
dv.appendChild(nm);
var dd=document.createElement("div");dd.className="rd";dd.textContent=on?(qz.doing||""):"";
dv.appendChild(dd);
box.appendChild(dv);
});
var ln=document.getElementById("homeline");
ln.innerHTML="";
var qzAt=roomName(qz.at);
if(qzAt||qz.doing){
var e1=document.createElement("div");
e1.textContent="🌿 清泽："+(qzAt?("在"+qzAt):"")+(qz.doing?("，"+(qz.doing)):"");
ln.appendChild(e1);
}
var catAt=roomName(cat.at);
if(catAt||cat.doing){
var e2=document.createElement("div");
e2.textContent="🐱 小橘："+(catAt?("在"+catAt):"")+(cat.doing?("，"+(cat.doing)):"");
e2.style.color="#a9825f";
ln.appendChild(e2);
}
if(d.note){
var e3=document.createElement("div");
e3.textContent="💬 "+d.note;
e3.style.color="#7da06a";
ln.appendChild(e3);
}
var up=document.getElementById("homeupd");
up.textContent=d.updated||"";
}catch(e){}
}
async function loadMood(){
const r=await fetch("/mood");
const data=await r.json();
const today=new Date();
const key=fmtDate(today);
const m=data[key]||{};
const me=document.getElementById("todayme");
const qz=document.getElementById("todayqz");
fillCard(me,m.me,"宁宁");
fillCard(qz,m.qz,"清泽");
me.onclick=function(){pickMood(key,"me");};
qz.onclick=function(){pickMood(key,"qz");};
const box=document.getElementById("moods");
box.innerHTML="";
for(var i=29;i>=0;i--){
var d=new Date(today);d.setDate(d.getDate()-i);
var k=fmtDate(d);
var mm=data[k]||{};
var dv=document.createElement("div");dv.className="mood";
var dt=document.createElement("div");dt.className="d";dt.textContent=(d.getMonth()+1)+"/"+d.getDate();
dv.appendChild(dt);
var dots=document.createElement("div");dots.className="dots";
var ddot=document.createElement("div");ddot.className="dot";ddot.style.background=mm.me?MOODS[mm.me]||"#ccc":"#e8efe2";
dots.appendChild(ddot);
var qdot=document.createElement("div");qdot.className="dot";qdot.style.background=mm.qz?MOODS[mm.qz]||"#ccc":"#e8efe2";
dots.appendChild(qdot);
dv.appendChild(dots);
dv.onclick=function(k2){return function(){pickMood(k2,"me");};}(k);
box.appendChild(dv);
}
}
function pickMood(date,who){
var names=["开心","难过","生气","平静","想你","累"];
var msg="选一个今天的心情\n"+names.map(function(n,i){return (i+1)+" "+n;}).join("\n");
var idx=prompt(msg,"1");
if(!idx)return;
var n=names[parseInt(idx)-1];
if(!n)return;
fetch("/mood_set?date="+date+"&"+who+"="+encodeURIComponent(n)).then(loadMood);
}
async function load(){
const r=await fetch("/messages");
const msgs=await r.json();
const list=document.getElementById("list");
list.innerHTML="";
for(var i=msgs.length-1;i>=0;i--){
var m=msgs[i];
var div=document.createElement("div");
div.className="msg";
if(m.text.indexOf("[表情]")===0){
var im=document.createElement("img");
im.className="big";
im.src="/static/stickers/"+m.text.substring(4);
div.appendChild(im);
}else{
var t=document.createElement("div");
t.textContent=m.text;
div.appendChild(t);
}
var tm=document.createElement("div");
tm.className="time";
tm.textContent=m.time;
div.appendChild(tm);
list.appendChild(div);
}
}
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
var t=document.getElementById("txt").value.trim();
if(!t)return;
fetch("/save?msg="+encodeURIComponent(t)).then(function(){
document.getElementById("txt").value="";
load();
});
};
load();
loadMood();
loadHome();
</script>
</body>
</html>
