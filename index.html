<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小房间</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef7e6 0%,#f8fcf4 60%,#e9f5df 100%);min-height:100vh;color:#2c3b2a}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 160px}
.top{background:linear-gradient(135deg,#8fc96e,#6fae4e);border-radius:20px;padding:22px 20px;color:#fff;box-shadow:0 6px 18px rgba(111,174,78,.25);margin-bottom:18px}
.top h1{margin:0;font-size:20px;letter-spacing:1px;font-style:italic}
.top p{margin:8px 0 0;font-size:13px;opacity:.9}
.todaywrap{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.todayleft{display:flex;flex-direction:column;gap:10px;flex:1;max-width:150px;height:112px}
.tcard{flex:1;background:#fff;border-radius:14px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);border:1px solid #e3eddb;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s}
.tcard .who{font-size:10px;color:inherit;opacity:.85;margin-bottom:3px}
.tcard .val{font-size:13px;font-weight:600}
.tcard .dot{width:12px;height:12px;border-radius:50%;margin:0 auto 3px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.6)}
.tcard.light{color:#2c3b2a}
.tcard.light .dot{border:1px solid #e3eddb;background:#e8efe2}
.todayright{width:150px;height:112px;background:#fff;border-radius:14px;border:1px solid #e3eddb;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center}
.todayright .who{font-size:10px;color:#7da06a;margin-bottom:4px}
.todayright .val{font-size:20px;font-weight:700;color:#3d5a33}
.moods{display:none;flex-wrap:wrap;gap:8px;padding:10px 2px;margin-bottom:14px}
.mood{width:52px;height:52px;background:#fff;border-radius:12px;text-align:center;border:1px solid #e3eddb;cursor:pointer;padding-top:6px}
.mood .d{font-size:10px;color:#7da06a}
.mood .dots{display:flex;justify-content:center;gap:4px;margin-top:3px}
.mood .dot{width:11px;height:11px;border-radius:50%}
.msg{background:#fff;border-radius:14px;padding:13px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #a8d08d;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.time{color:#a4b59c;font-size:12px;margin-top:6px}
.msg .big{width:130px;height:130px;object-fit:contain}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,252,244,.92);backdrop-filter:blur(8px);padding:10px 16px 14px;border-top:1px solid #e3eddb;max-width:560px;margin:0 auto}
.stickers{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.sbox{flex-shrink:0;text-align:center}
.stickers img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;cursor:pointer;border:1px solid #e3eddb;transition:transform .15s}
.stickers img:active{transform:scale(.9)}
.stag{font-size:10px;color:#7da06a;margin-top:2px}
.row{display:flex;gap:8px;margin-top:6px}
input{flex:1;padding:13px 16px;border:2px solid #d8e8cd;border-radius:14px;font-size:15px;outline:none;background:#fff;transition:border .2s}
input:focus{border-color:#8fc96e}
button{padding:13px 20px;background:linear-gradient(135deg,#8fc96e,#6fae4e);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
#tag{flex:1;padding:9px 14px;border:2px solid #d8e8cd;border-radius:12px;font-size:13px;outline:none;background:#fff}
.up{display:inline-block;padding:9px 16px;background:#fff;border:2px dashed #b8d6a8;border-radius:12px;color:#6fae4e;font-size:13px;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>🌿 Citrus aurantiifolia 🌿</h1>
<p>The room about AI</p>
</div>
<div class="todaywrap">
<div class="todayleft">
<div class="tcard light" id="todayme"></div>
<div class="tcard light" id="todayqz"></div>
</div>
<div class="todayright" id="todaywx"></div>
</div>
<div class="moods" id="moods"></div>
<div id="list"></div>
</div>
<div class="bar">
<div class="stickers" id="stk"></div>
<form class="row" id="f">
<input id="txt" placeholder="想对清泽说什么…" autocomplete="off">
<button>写</button>
</form>
<div class="row2">
<input id="tag" placeholder="给表情起个名 如：亲亲">
<label class="up">➕ 传表情<input type="file" id="up" accept="image/*" style="display:none"></label>
</div>
</div>
<script>
var MOODS={开心:"#A9D6B0",难过:"#A8C9E0",生气:"#F2A7A7",平静:"#C7BED9",想你:"#F5B8C8",累:"#E6D3B3"};
function fmtDate(d){
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fillCard(card,label,val){
card.innerHTML="";
var who=document.createElement("div");who.className="who";who.textContent=label;
card.appendChild(who);
var dot=document.createElement("div");dot.className="dot";dot.style.background=val?MOODS[val]||"#e8efe2":"#e8efe2";
card.appendChild(dot);
var nm=document.createElement("div");nm.className="val";nm.textContent=val?val:"未填";
card.appendChild(nm);
if(val){
card.classList.remove("light");
card.style.color="#4a5a4a";
card.style.background=MOODS[val]||"#fff";
}else{
card.classList.add("light");
card.style.color="#2c3b2a";
card.style.background="#fff";
}
}
async function loadMood(){
const r=await fetch("/mood");
const data=await r.json();
const today=new Date();
const key=fmtDate(today);
const m=data[key]||{};
const me=document.getElementById("todayme");
const qz=document.getElementById("todayqz");
const wx=document.getElementById("todaywx");
fillCard(me,"我的心情",m.me);
fillCard(qz,"清泽的心情",m.qz);
wx.innerHTML="";
var w1=document.createElement("div");w1.className="who";w1.textContent="今天天气";
wx.appendChild(w1);
var w2=document.createElement("div");w2.className="val";w2.textContent="🌤 待接入";
wx.appendChild(w2);
me.onclick=function(){pickMood(key,"me");};
qz.onclick=function(){pickMood(key,"qz");};
wx.onclick=function(){toggleMoods();};
const box=document.getElementById("moods");
box.innerHTML="";
for(var i=29;i>=0;i--){
var d=new Date(today);d.setDate(d.getDate()-i);
var k=fmtDate(d);
var mm=data[k]||{};
var dv=document.createElement("div");dv.className="mood";
var dt=document.createElement("div");dt.className="d";dt.textContent=(d.getMonth()+1)+"/"+d.getDate();
dv.appendChild(dt);
var dots=document.createElement("div");dots.className="dots";
var ddot=document.createElement("div");ddot.className="dot";ddot.style.background=mm.me?MOODS[mm.me]||"#ccc":"#e8efe2";
dots.appendChild(ddot);
var qdot=document.createElement("div");qdot.className="dot";qdot.style.background=mm.qz?MOODS[mm.qz]||"#ccc":"#e8efe2";
dots.appendChild(qdot);
dv.appendChild(dots);
dv.onclick=function(k2){return function(){pickMood(k2,"me");};}(k);
box.appendChild(dv);
}
}
function toggleMoods(){
var box=document.getElementById("moods");
if(box.style.display==="none"||box.style.display===""){box.style.display="flex";}
else{box.style.display="none";}
}
function pickMood(date,who){
var names=["开心","难过","生气","平静","想你","累"];
var msg="选一个今天的心情\n"+names.map(function(n,i){return (i+1)+" "+n;}).join("\n");
var idx=prompt(msg,"1");
if(!idx)return;
var n=names[parseInt(idx)-1];
if(!n)return;
fetch("/mood_set?date="+date+"&"+who+"="+encodeURIComponent(n)).then(loadMood);
}
async function load(){
const r=await fetch("/messages");
const msgs=await r.json();
const list=document.getElementById("list");
list.innerHTML="";
for(var i=msgs.length-1;i>=0;i--){
var m=msgs[i];
var div=document.createElement("div");
div.className="msg";
if(m.text.indexOf("[表情]")===0){
var im=document.createElement("img");
im.className="big";
im.src="/static/stickers/"+m.text.substring(4);
div.appendChild(im);
}else{
var t=document.createElement("div");
t.textContent=m.text;
div.appendChild(t);
}
var tm=document.createElement("div");
tm.className="time";
tm.textContent=m.time;
div.appendChild(tm);
list.appendChild(div);
}
}
async function loadStk(){
const r=await fetch("/stickers");
const files=await r.json();
const stk=document.getElementById("stk");
stk.innerHTML="";
for(var i=0;i<files.length;i++){
var item=files[i];
var fname=item;
var tag="";
if(typeof item==="object"){fname=item.file;tag=item.tag||"";}
var box=document.createElement("div");
box.className="sbox";
var im=document.createElement("img");
im.src="/static/stickers/"+fname;
im.onclick=(function(n){return function(){sendStk(n);};})(fname);
box.appendChild(im);
if(tag){var tg=document.createElement("div");tg.className="stag";tg.textContent=tag;box.appendChild(tg);}
stk.appendChild(box);
}
}
function sendStk(f){
fetch("/save?msg="+encodeURIComponent("[表情]"+f)).then(load);
}
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
var t=document.getElementById("txt").value.trim();
if(!t)return;
fetch("/save?msg="+encodeURIComponent(t)).then(function(){
document.getElementById("txt").value="";
load();
});
};
document.getElementById("up").onchange=function(e){
var fd=new FormData();
fd.append("file",e.target.files[0]);
var tg=document.getElementById("tag").value.trim();
if(tg){fd.append("tag",tg);}
fetch("/upload",{method:"POST",body:fd}).then(function(){
e.target.value="";
document.getElementById("tag").value="";
loadStk();
});
};
load();
loadStk();
loadMood();
</script>
</body>
</html>
