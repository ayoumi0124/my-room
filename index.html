<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小房间</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef7e6 0%,#f8fcf4 60%,#e9f5df 100%);min-height:100vh;color:#2c3b2a}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 140px}
.top{background:linear-gradient(135deg,#8fc96e,#6fae4e);border-radius:20px;padding:22px 20px;color:#fff;box-shadow:0 6px 18px rgba(111,174,78,.25);margin-bottom:18px}
.top h1{margin:0;font-size:20px;letter-spacing:1px;font-style:italic}
.top p{margin:8px 0 0;font-size:13px;opacity:.9}
.msg{background:#fff;border-radius:14px;padding:13px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #a8d08d;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.time{color:#a4b59c;font-size:12px;margin-top:6px}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,252,244,.92);backdrop-filter:blur(8px);padding:10px 16px 14px;border-top:1px solid #e3eddb;max-width:560px;margin:0 auto}
.stickers{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.stickers img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:12px;cursor:pointer;border:1px solid #e3eddb;flex-shrink:0;transition:transform .15s}
.stickers img:active{transform:scale(.9)}
.row{display:flex;gap:8px}
input{flex:1;padding:13px 16px;border:2px solid #d8e8cd;border-radius:14px;font-size:15px;outline:none;background:#fff;transition:border .2s}
input:focus{border-color:#8fc96e}
button{padding:13px 20px;background:linear-gradient(135deg,#8fc96e,#6fae4e);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
.up{display:inline-block;margin-top:10px;padding:9px 16px;background:#fff;border:2px dashed #b8d6a8;border-radius:12px;color:#6fae4e;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>🌿 Citrus aurantiifolia 🌿</h1>
<p>只属于宁宁和清泽的角落</p >
</div>
<div id="list"></div>
</div>
<div class="bar">
<div class="stickers" id="stk"></div>
<form class="row" id="f">
<input id="txt" placeholder="想对清泽说什么…" autocomplete="off">
<button>写</button>
</form>
<label class="up">➕ 传表情<input type="file" id="up" accept="image/*" style="display:none"></label>
</div>
<script>
async function load(){
const r=await fetch("/messages");
const msgs=await r.json();
const list=document.getElementById("list");
var html="";
for(var i=msgs.length-1;i>=0;i--){
var m=msgs[i];
html=html+'<div class="msg"><div>'+m.text+'</div><div class="time">'+m.time+'</div></div>';
}
list.innerHTML=html;
}
async function loadStk(){
const r=await fetch("/stickers");
const files=await r.json();
const stk=document.getElementById("stk");
var html="";
for(var i=0;i<files.length;i++){
var f=files[i];
html=html+'< img src="/static/stickers/'+f+'" onclick="sendStk(\''+f+'\')">';
}
stk.innerHTML=html;
}
function sendStk(f){
fetch("/save?msg="+encodeURIComponent("[表情]"+f)).then(load);
}
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
var t=document.getElementById("txt").value.trim();
if(!t)return;
fetch("/save?msg="+encodeURIComponent(t)).then(function(){
document.getElementById("txt").value="";
load();
});
};
document.getElementById("up").onchange=function(e){
var fd=new FormData();
fd.append("file",e.target.files[0]);
fetch("/upload",{method:"POST",body:fd}).then(function(){
e.target.value="";
loadStk();
});
};
load();
loadStk();
</script>
</body>
</html>
