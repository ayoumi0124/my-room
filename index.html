<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小房间</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef7e6 0%,#f8fcf4 60%,#e9f5df 100%);min-height:100vh;color:#2c3b2a}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 160px}
.top{background:linear-gradient(135deg,#8fc96e,#6fae4e);border-radius:20px;padding:22px 20px;color:#fff;box-shadow:0 6px 18px rgba(111,174,78,.25);margin-bottom:18px}
.top h1{margin:0;font-size:20px;letter-spacing:1px;font-style:italic}
.top p{margin:8px 0 0;font-size:13px;opacity:.9}
.moods{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin-bottom:14px}
.mood{background:#fff;border-radius:12px;padding:8px;min-width:54px;text-align:center;border:1px solid #e3eddb;cursor:pointer;flex-shrink:0}
.mood .d{font-size:11px;color:#7da06a}
.mood .dots{display:flex;justify-content:center;gap:5px;margin-top:5px}
.mood .dot{width:13px;height:13px;border-radius:50%}
.msg{background:#fff;border-radius:14px;padding:13px 16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:4px solid #a8d08d;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.time{color:#a4b59c;font-size:12px;margin-top:6px}
.msg .big{width:130px;height:130px;object-fit:contain}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(248,252,244,.92);backdrop-filter:blur(8px);padding:10px 16px 14px;border-top:1px solid #e3eddb;max-width:560px;margin:0 auto}
.stickers{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.sbox{flex-shrink:0;text-align:center}
.stickers img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;cursor:pointer;border:1px solid #e3eddb;transition:transform .15s}
.stickers img:active{transform:scale(.9)}
.stag{font-size:10px;color:#7da06a;margin-top:2px}
.row{display:flex;gap:8px;margin-top:6px}
input{flex:1;padding:13px 16px;border:2px solid #d8e8cd;border-radius:14px;font-size:15px;outline:none;background:#fff;transition:border .2s}
input:focus{border-color:#8fc96e}
button{padding:13px 20px;background:linear-gradient(135deg,#8fc96e,#6fae4e);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer}
#tag{flex:1;padding:9px 14px;border:2px solid #d8e8cd;border-radius:12px;font-size:13px;outline:none;background:#fff}
.up{display:inline-block;padding:9px 16px;background:#fff;border:2px dashed #b8d6a8;border-radius:12px;color:#6fae4e;font-size:13px;cursor:pointer}
.row2{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>🌿 Citrus aurantiifolia 🌿</h1>
<p>The room about AI</p >
</div>
<div class="moods" id="moods"></div>
<div id="list"></div>
</div>
<div class="bar">
<div class="stickers" id="stk"></div>
<form class="row" id="f">
<input id="txt" placeholder="想对清泽说什么…" autocomplete="off">
<button>写</button>
</form>
<div class="row2">
<input id="tag" placeholder="给表情起个名 如：亲亲">
<label class="up">➕ 传表情<input type="file" id="up" accept="image/*" style="display:none"></label>
</div>
</div>
<script>
var MOODS={开心:"#7db55e",难过:"#5b8fb9",生气:"#d96c6c",平静:"#b8c2b0",想你:"#e89ac0",累:"#c9a86a"};
async function loadMood(){
const r=await fetch("/mood");
const data=await r.json();
const box=document.getElementById("moods");
box.innerHTML="";
const today=new Date();
for(var i=13;i>=0;i--){
var d=new Date(today);d.setDate(d.getDate()-i);
var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
var m=data[key]||{};
var dv=document.createElement("div");dv.className="mood";
var dt=document.createElement("div");dt.className="d";dt.textContent=(d.getMonth()+1)+"/"+d.getDate();
dv.appendChild(dt);
var dots=document.createElement("div");dots.className="dots";
var dm=document.createElement("div");dm.className="dot";dm.style.background=m.me?MOODS[m.me]||"#ccc":"#e8efe2";
var dq=document.createElement("div");dq.className="dot";dq.style.background=m.qz?MOODS[m.qz]||"#ccc":"#e8efe2";
dots.appendChild(dm);dots.appendChild(dq);dv.appendChild(dots);
dv.onclick=function(k){return function(){pickMood(k);};}(key);
box.appendChild(dv);
}
}
function pickMood(date){
var names=["开心","难过","生气","平静","想你","累"];
var msg="选一个今天的心情\n"+names.map(function(n,i){return (i+1)+" "+n;}).join("\n");
var idx=prompt(msg,"1");
if(!idx)return;
var n=names[parseInt(idx)-1];
if(!n)return;
fetch("/mood_set?date="+date+"&me="+encodeURIComponent(n)).then(loadMood);
}

list.innerHTML="";
for(var i=msgs.length-1;i>=0;i--){
var m=msgs[i];
var div=document.createElement("div");
div.className="msg";
if(m.text.indexOf("[表情]")===0){
var im=document.createElement("img");
im.className="big";
im.src="/static/stickers/"+m.text.subs
