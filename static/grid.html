<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>格子尺子 · grid</title>
<style>
  :root{--bg:#14131a;--card:#1e1c26;--line:#2e2b38;--ink:#e8e2ee;--dim:#9d94a6;--hot:#ffd696}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(20,19,26,.97);
    border-bottom:1px solid var(--line);padding:10px 12px}
  h1{margin:0 0 8px;font-size:15px;font-weight:600}
  h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input,button{font:inherit;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  input[type=number]{width:72px}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .hint b{color:var(--hot)}
  .scroll{overflow:auto;padding:10px 10px 130px}
  .grid{display:grid;gap:1px;background:#2e2b38;width:max-content}
  .cell{background:#11101a;position:relative;display:flex;align-items:flex-end;justify-content:center}
  .cell.on{outline:2px solid var(--hot);outline-offset:-2px;z-index:2}
  .cell i{position:absolute;left:1px;top:1px;font-style:normal;font-size:8px;color:#6c6480;pointer-events:none}
  .cell.on i{color:#3a2a16;background:var(--hot);padding:0 2px;border-radius:3px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,19,26,.97);
    border-top:1px solid var(--line);padding:10px 12px}
  textarea{width:100%;height:64px;background:#11101a;color:#b8f0c0;
    border:1px solid var(--line);border-radius:8px;padding:8px;
    font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
</style>
</head>
<body>
<header>
  <h1>格子尺子 <small>量哪一格是什么</small></h1>
  <div class="row">
    <select id="file"></select>
    <label>从第 <input type="number" id="from" value="0" min="0"> 行</label>
    <label>看 <input type="number" id="rows" value="4" min="1" max="41"> 行</label>
    <button id="zoom">缩放 1x</button>
  </div>
  <div class="hint">一格 <b>32×32</b>。左上是第 0 行第 0 列。点一下会记下坐标。找「正面」最好看 <b>Eyes</b> 那张 —— 眼睛只在正面出现。</div>
</header>

<div class="scroll"><div class="grid" id="grid"></div></div>

<div class="bar"><textarea id="out" readonly placeholder="点中的格子会出现在这里"></textarea></div>

<script>
"use strict";
/* ============================================================
   格子尺子 · grid
   把角色生成器的大表按 32×32 切开铺出来，好定位某一格是什么
   素材：Tiles by LimeZu — https://limezu.itch.io/
   ============================================================ */

const CG = "tiles/2_Characters/Character_Generator/";
const FILES = [
  "Eyes/32x32/Eyes_32x32_01.png",
  "Eyes/32x32/Eyes_32x32_02.png",
  "Bodies/32x32/Body_32x32_01.png",
  "Bodies/32x32/Body_32x32_02.png",
  "Hairstyles/32x32/Hairstyle_01_32x32_01.png",
  "Hairstyles/32x32/Hairstyle_02_32x32_01.png",
  "Outfits/32x32/Outfit_01_32x32_01.png",
  "Outfits/32x32/Outfit_02_32x32_01.png"
];

const sel = document.getElementById("file");
const fromEl = document.getElementById("from");
const rowsEl = document.getElementById("rows");
const gridEl = document.getElementById("grid");
const outEl  = document.getElementById("out");
const zoomEl = document.getElementById("zoom");

let zoom = 1;
const picked = [];

FILES.forEach((f, i) => {
  const o = document.createElement("option");
  o.value = String(i);
  o.textContent = f.split("/").pop();
  sel.appendChild(o);
});

function render() {
  const path = CG + FILES[Number(sel.value)];
  const from = Math.max(0, Number(fromEl.value) || 0);
  const n    = Math.max(1, Math.min(41, Number(rowsEl.value) || 4));
  const C = 56;                       /* 1792 / 32 */
  const s = 32 * zoom;

  gridEl.style.gridTemplateColumns = "repeat(" + C + "," + s + "px)";
  gridEl.innerHTML = "";

  const im = new Image();
  im.onload = () => {
    const cols = Math.round(im.naturalWidth / 32);
    const rws  = Math.round(im.naturalHeight / 32);
    gridEl.style.gridTemplateColumns = "repeat(" + cols + "," + s + "px)";

    for (let r = from; r < Math.min(from + n, rws); r++) {
      for (let c = 0; c < cols; c++) {
        const d = document.createElement("div");
        d.className = "cell";
        d.style.width = s + "px";
        d.style.height = s + "px";
        d.style.backgroundImage = "url(\"" + path + "\")";
        d.style.backgroundSize = (cols * s) + "px " + (rws * s) + "px";
        d.style.backgroundPosition = "-" + (c * s) + "px -" + (r * s) + "px";
        d.style.imageRendering = "pixelated";
        if (zoom >= 2) { const i = document.createElement("i"); i.textContent = c; d.appendChild(i); }
        d.addEventListener("click", () => {
          if (d.classList.contains("on")) { d.classList.remove("on"); }
          else {
            document.querySelectorAll(".cell.on").forEach(e => e.classList.remove("on"));
            d.classList.add("on");
          }
          outEl.value = FILES[Number(sel.value)] + "\n行 " + r + " 列 " + c;
        });
        gridEl.appendChild(d);
      }
    }

    /* 左边挂一行行号 */
  };
  im.src = path;
}

sel.addEventListener("change", render);
fromEl.addEventListener("change", render);
rowsEl.addEventListener("change", render);
zoomEl.addEventListener("click", () => {
  zoom = zoom === 1 ? 2 : 1;
  zoomEl.textContent = "缩放 " + zoom + "x";
  render();
});

render();
</script>
</body>
</html>
