<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>挑角色 · chars</title>
<style>
  :root{--bg:#14131a;--card:#1e1c26;--line:#2e2b38;--ink:#e8e2ee;--dim:#9d94a6;--hot:#ffd696}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:rgba(20,19,26,.96);
    border-bottom:1px solid var(--line);padding:10px 12px}
  h1{margin:0 0 6px;font-size:15px;font-weight:600}
  h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .hint{color:var(--dim);font-size:12px}
  .hint b{color:var(--hot);font-weight:600}
  .grid{display:grid;gap:8px;padding:10px;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 6px 6px;text-align:center;cursor:pointer;user-select:none}
  .cell.on{border-color:var(--hot);background:#2b2530}
  .cell.dead{opacity:.22}
  /* 整张 idle 原样铺出来：128×64 = 2:1，四个朝向并排 */
  .fig{width:100%;aspect-ratio:2/1;margin:0 auto 5px;image-rendering:pixelated;
    background-repeat:no-repeat;background-size:contain;background-position:center}
  .cell b{display:block;font-size:11px;color:var(--dim);font-weight:500;word-break:break-all}
  .cell.on b{color:var(--hot)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,19,26,.97);
    border-top:1px solid var(--line);padding:10px 12px}
  textarea{width:100%;height:58px;background:#11101a;color:#b8f0c0;
    border:1px solid var(--line);border-radius:8px;padding:8px;
    font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .pad{padding-bottom:120px}
</style>
</head>
<body>
<header>
  <h1>挑角色 <small>Old / Single_Characters_Legacy</small></h1>
  <div class="hint">每格是整张 <b>_idle</b>（四个朝向并排：正、左、右、背）。点两个 —— 宁宁一个、清泽一个。</div>
</header>

<div class="grid pad" id="grid"></div>

<div class="bar">
  <textarea id="out" readonly placeholder="选中的会出现在这里"></textarea>
</div>

<script>
"use strict";
/* ============================================================
   挑角色 · chars
   整张 <名字>_idle_32x32.png 原样铺出来，不裁切
   素材：Tiles by LimeZu — https://limezu.itch.io/
   ============================================================ */

const BASE = "tiles/2_Characters/Old/Single_Characters_Legacy/32x32/";

const NAMES = [
  "Adam","Alex","Amelia","Ash","Bob","Bouncer","Bruce","Butcher",
  "Chef_Alex","Chef_Lucy","Chef_Molly","Chef_Pier","Chef_Rob",
  "Cleaner_boy","Cleaner_girl","Conference_man","Conference_woman",
  "Dan","Doctor_1","Doctor_2","Edward","Fishmonger_1","Fishmonger_2",
  "Halloween_Kid_1","Halloween_Kid_2",
  "Kid_Abby","Kid_Karen","Kid_Mitty","Kid_Oscar","Kid_Romeo","Kid_Tim",
  "Lucy","Molly","Nurse_1","Nurse_2","Old_man_Josh","Old_woman_Jenny","Pier",
  "Prisoner_1","Prisoner_2","Prisoner_3","Rob","Roki","Samuel","Santa_Claus",
  "Witch","Zombie"
];

const grid = document.getElementById("grid");
const out  = document.getElementById("out");
const picked = [];

NAMES.forEach((nm) => {
  const url = BASE + nm + "_idle_32x32.png";

  const d = document.createElement("div");
  d.className = "cell";

  const f = document.createElement("div");
  f.className = "fig";
  f.style.backgroundImage = "url(\"" + url + "\")";

  const b = document.createElement("b");
  b.textContent = nm;

  d.appendChild(f); d.appendChild(b);
  d.addEventListener("click", () => toggle(nm, d));
  grid.appendChild(d);

  const probe = new Image();
  probe.onerror = () => { d.classList.add("dead"); d.style.pointerEvents = "none"; };
  probe.src = url;
});

function toggle(nm, cell) {
  const i = picked.indexOf(nm);
  if (i >= 0) { picked.splice(i, 1); cell.classList.remove("on"); }
  else { picked.push(nm); cell.classList.add("on"); }
  out.value = picked.map((n, k) => (k === 0 ? "宁宁 → " : (k === 1 ? "清泽 → " : "另外 → ")) + n).join("\n");
}
</script>
</body>
</html>
