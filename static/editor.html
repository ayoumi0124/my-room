<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摆家 · editor</title>
<style>
  :root{--bg:#14131a;--card:#1e1c26;--line:#2e2b38;--ink:#e8e2ee;--dim:#9d94a6;--hot:#ffd696}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
    font:13px/1.45 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow:hidden}
  header{flex:none;background:rgba(20,19,26,.96);border-bottom:1px solid var(--line);padding:8px 10px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  select,button{font:inherit;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:5px 9px}
  button:active{background:#2a2733}
  button.hot{background:#3a4a63;border-color:#4a5f80}
  button.on{background:#4a3f2a;border-color:var(--hot)}
  .wrap{flex:1;display:flex;min-height:0}
  .lib{width:118px;flex:none;overflow-y:auto;border-right:1px solid var(--line);
    padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
  .lib .cell{background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:3px;text-align:center;cursor:pointer;user-select:none}
  .lib .cell:active{border-color:var(--hot)}
  .lib .cell img{image-rendering:pixelated;width:100%;height:38px;object-fit:contain;display:block;pointer-events:none}
  .lib .cell b{display:block;font-size:9px;color:var(--dim);font-weight:500;pointer-events:none}
  /* 铺墙地模式：左栏变宽，放素材大表 */
  body.base .lib{display:block;width:clamp(190px,42%,420px);padding:6px}
  .lib .hint{font-size:11px;color:var(--dim);margin:0 0 6px}
  .lib .status{font-size:11px;color:var(--dim);margin:0 0 6px;word-break:break-all}
  .lib .status.warn{color:#ffb0a0}
  .lib .swatch{display:flex;gap:6px;align-items:center;margin:0 0 8px;font-size:11px;color:var(--dim)}
  .lib .swatch canvas{image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;background:#11101a}
  .lib .atlasbox{overflow:auto;max-width:100%}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;background:#0e0d12;overflow:hidden}
  canvas{display:block;touch-action:none;image-rendering:pixelated}
  footer{flex:none;border-top:1px solid var(--line);padding:6px 10px;display:flex;gap:6px;
    align-items:center;background:rgba(20,19,26,.96)}
  textarea{flex:1;height:52px;background:#11101a;color:#b8f0c0;border:1px solid var(--line);
    border-radius:7px;padding:6px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:none}
  .tip{color:var(--dim);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="row">
    <select id="room"></select>
    <select id="theme"></select>
    <button id="mFur" class="on">摆家具</button>
    <button id="mBase">铺墙地</button>
  </div>
  <div class="row" id="baseCtl" style="display:none;margin-top:6px">
    <button id="tWall" class="on">贴墙</button>
    <button id="tFloor">贴地</button>
    <select id="sheet"></select>
    <button id="zS">小</button>
    <button id="zM">中</button>
    <button id="zL">大</button>
    <button id="clrBase">清掉这一层</button>
  </div>
  <div class="row" id="toolRow" style="margin-top:6px">
    <button id="del">删掉选中</button>
    <button id="narrow">◀ 窄</button>
    <button id="wide">宽 ▶</button>
    <button id="stretch">平铺开关</button>
    <button id="back">▼ 后</button>
    <button id="front">▲ 前</button>
    <button class="hot" id="copy">复制清单</button>
  </div>
  <div class="tip" id="tip">左边点一下 → 进屋子；拖屋里那件 → 挪位置；点中会亮黄边。</div>
</header>

<div class="wrap">
  <div class="lib" id="lib"></div>
  <div class="stage"><canvas id="c"></canvas></div>
</div>

<footer>
  <textarea id="out" readonly placeholder="这间屋子的清单会出现在这里"></textarea>
</footer>

<script>
"use strict";
/* ============================================================
   摆家 · editor
   两种模式：
     摆家具 —— 左边图库 → 点进右边屋子 → 拖位置 → 出来是 items
     铺墙地 —— 左边是一张 Room_Builder 大表，点一格 → 铺到当前房间 → 出来是 base
   坐标跟 house.html 一致：x=左, y=顶, w=显示宽, h=到底边的框
   素材：Tiles by LimeZu —— https://limezu.itch.io/
   注意：作者把 Builder 拼成 Bulder（少一个 i）。下面 RB_LIST 会两种都试一遍。
   ============================================================ */

const W = 360, H = 640, WALL_Y = 150;
const FLOOR = { x0: 12, x1: 348, y0: WALL_Y, y1: 570 };
const TILE = 32;                    // 墙 / 地板一块在屋子坐标里占多少

/* ---------- 家具图库 ---------- */
const BASE = "tiles/1_Interiors/32x32/Theme_Sorter_Singles_32x32/";
/* pre 是文件前缀。扫不到的号会自动跳过，所以写多列几个不影响。 */
const THEMES = [
  { key:"living",     label:"客厅",      dir:"2_Living_Room_Singles_32x32",                pre:"Living_Room_Singles_32x32_",                max:220 },
  { key:"bedroom",    label:"卧室",      dir:"4_Bedroom_Singles_32x32",                    pre:"Bedroom_Singles_32x32_",                    max:600 },
  { key:"kitchen",    label:"厨房",      dir:"12_Kitchen_Singles_32x32",                   pre:"Kitchen_Singles_32x32_",                    max:450 },
  { key:"classroom",  label:"教室书房",  dir:"5_Classroom_and_Library_Singles_32x32",      pre:"Classroom_and_Library_Singles_32x32_",      max:300 },
  { key:"japanese",   label:"日式",      dir:"20_Japanese_Interiors_Singles_32x32",        pre:"Japanese_Interiors_32x32_",                 max:220 },
  { key:"bathroom",   label:"浴室",      dir:"3_Bathroom_Singles_32x32",                   pre:"Bathroom_Singles_32x32_",                   max:220 },
  { key:"party",      label:"派对",      dir:"10_Birthday_Party_Singles_32x32",            pre:"Birthday_Party_Singles_32x32_",             max:200 },
  { key:"halloween",  label:"万圣节",    dir:"11_Halloween_Singles_32x32",                  pre:"Halloween_Singles_32x32_",                  max:200 },
  { key:"christmas",  label:"圣诞",      dir:"15_Christmas_Singles_32x32",                  pre:"Christmas_Singles_32x32_",                  max:250 },
  { key:"condo",      label:"公寓",      dir:"26_Condominium_Singles_32x32",                pre:"Condominium_Singles_32x32_",                max:150 },
  { key:"clothing",   label:"服装店",    dir:"21_Clothing_Store_Singles_32x32",              pre:"Clothing_Store_Singles_32x32_",             max:450 },
  { key:"grocery",    label:"杂货店",    dir:"16_Grocery_Store_Singles_32x32",              pre:"Grocery_Store_Singles_32x32_",              max:250 },
  { key:"icecream",   label:"冰淇淋店",  dir:"24_Ice_Cream_Shop_Singles_32x32",             pre:"Ice_Cream_Shop_Singles_32x32_",             max:200 },
  { key:"museum",     label:"博物馆",    dir:"22_Museum_Singles_32x32",                     pre:"Museum_Singles_32x32_",                     max:250 },
  { key:"gym",        label:"健身房",    dir:"8_Gym_Singles_32x32",                         pre:"Gym_Singles_32x32_",                        max:250 },
  { key:"art",        label:"美术",      dir:"7_Art_Singles_32x32",                         pre:"Art_Singles_32x32_",                        max:250 },
  { key:"fishing",    label:"钓鱼",      dir:"9_Fishing_Singles_32x32",                     pre:"Fishing_Singles_32x32_",                    max:200 },
  { key:"music",      label:"音乐运动",  dir:"6_Music_and_Sport_32x32",                     pre:"Music_and_Sport_Singles_32x32_",            max:250 },
  { key:"conference", label:"会议室",    dir:"13_Conference_Hall_Singles_32x32",            pre:"Conference_Hall_Singles_32x32_",            max:200 },
  { key:"basement",   label:"地下室",    dir:"14_Basement_Singles_32x32",                   pre:"Basement_Singles_32x32_",                   max:200 },
  { key:"hospital",   label:"医院",      dir:"19_Hospital_SIngles_32x32",                   pre:"Hospital_Singles_32x32_",                   max:250 },
  { key:"jail",       label:"牢房",      dir:"18_Jail_Singles_32x32",                       pre:"Jail_Singles_32x32_",                       max:400 },
  { key:"shooting",   label:"射击场",    dir:"25_Shooting_Range_Singles_32x32",             pre:"Shooting_Range_Singles_32x32_",             max:200 },
  { key:"tv",         label:"影视棚",    dir:"23_Television_and_Film_Studio_SIngles_32x32", pre:"Television_and_Film_Studio_Singles_32x32_", max:150 }
];
const THEME_BY_KEY = Object.fromEntries(THEMES.map(t => [t.key, t]));
const urlOf = (c, n) => BASE + THEME_BY_KEY[c].dir + "/" + THEME_BY_KEY[c].pre + n + ".png";

/* ---------- 墙 / 地板素材表 ----------
   路径写三份，第一个读不到就自动试下一个。
   要是三个全读不到，左边会红字写「读不到大表」，把那行发给清泽就行。 */
const RB_LIST = [
  "tiles/1_Interiors/32x32/Room_Bulder_subfiles_32x32/",
  "tiles/1_Interiors/32x32/Room_Builder_subfiles_32x32/",
  "tiles/1_Interiors/32x32/Room_Bulder_subfiles_32x32"
];
const SHEETS = [
  { key:"walls",  label:"墙纸",     file:"Room_Builder_Walls_32x32.png",         cols:32, rows:40 },
  { key:"floors", label:"地板",     file:"Room_Builder_Floors_32x32.png",        cols:15, rows:40 },
  { key:"shadow", label:"墙脚阴影", file:"Room_Builder_Floor_Shadows_32x32.png", cols:16, rows:5  },
  { key:"base",   label:"踢脚线",   file:"Room_Builder_baseboards_32x32.png",    cols:6,  rows:6  }
];
const SHEET_BY = Object.fromEntries(SHEETS.map(s => [s.key, s]));

/* ---------- 房间 ---------- */
const ROOMS = [
  { key:"living",  label:"客厅", wall:["#efe1cd","#e3d2ba"], floor:["#d8b98e","#c8a575"], line:"rgba(150,118,80,.35)" },
  { key:"study",   label:"书房", wall:["#e7e1d3","#d9d1c0"], floor:["#c9b699","#b8a37f"], line:"rgba(130,105,70,.35)" },
  { key:"bedroom", label:"卧室", wall:["#e9e2ea","#dcd2dd"], floor:["#cbb6a0","#b8a08a"], line:"rgba(140,110,90,.32)" },
  { key:"kitchen", label:"厨房", wall:["#e9efd6","#dbe4c2"], floor:["#ded5c4","#cdc2ac"], line:"rgba(140,120,90,.30)" },
  { key:"cat",     label:"猫窝", wall:["#f0e6d8","#e2d4c0"], floor:["#e0cbaa","#d0b894"], line:"rgba(150,120,80,.32)" },
  { key:"garden",  label:"花园", wall:["#cfe6c4","#b0d69e"], floor:["#95c476","#7fb262"], line:"rgba(80,130,60,.35)"  }
];
const ROOM_BY_KEY = Object.fromEntries(ROOMS.map(r => [r.key, r]));

const DATA = {};
ROOMS.forEach(r => { DATA[r.key] = { wall:null, floor:null, items:[] }; });

let curRoom    = "living";
let sel        = -1;
let mode       = "furniture";   // furniture | base
let baseTarget = "wall";        // wall | floor
let sheetKey   = "walls";
let atlasTile  = 20;            // 大表上一格占多少屏幕像素

const cv  = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const lib = document.getElementById("lib");
const out = document.getElementById("out");

/* ---------- 图片缓存（带备用路径） ---------- */
const IMG = Object.create(null);
function getImg(u, cb) {
  let e = IMG[u];
  if (!e) {
    e = IMG[u] = { ok:false, el:new Image() };
    e.el.onload  = () => { e.ok = true;  cb && cb(); };
    e.el.onerror = () => { e.ok = false; };
    e.el.src = u;
  } else if (cb && e.ok) {
    cb();
  }
  return e;
}

/* 大表：依次试 RB_LIST 里的路径 */
const SHEET = Object.create(null);
let sheetStatus = "";
function getSheet(sh, cb) {
  let s = SHEET[sh.key];
  if (s && s.ok) { cb && cb(); return s; }
  if (!s) {
    s = SHEET[sh.key] = { ok:false, el:new Image(), url:"", i:0 };
    (function tryNext() {
      if (s.i >= RB_LIST.length) {
        sheetStatus = "读不到大表（试过 " + RB_LIST.length + " 个路径）。第一行是：" + RB_LIST[0] + sh.file;
        drawAtlas();
        return;
      }
      const u = RB_LIST[s.i] + sh.file;
      s.url = u;
      s.el.onload  = () => { s.ok = true; sheetStatus = "已读到 " + sh.file + "  （" + s.el.naturalWidth + "×" + s.el.naturalHeight + "）"; drawAtlas(); draw(); };
      s.el.onerror = () => { s.i++; tryNext(); };
      s.el.src = u;
    })();
  }
  return s;
}
function sheetReady(sh) { const s = SHEET[sh.key]; return s && s.ok ? s : null; }

/* ---------- 屋子画布 ---------- */
let scale = 1;
function fit() {
  const st = cv.parentElement.getBoundingClientRect();
  scale = Math.min(st.width / W, st.height / H) || 1;
  cv.style.width  = Math.round(W * scale) + "px";
  cv.style.height = Math.round(H * scale) + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  draw();
}
addEventListener("resize", fit);

function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}

function boxOf(o) {
  const e = getImg(urlOf(o.c, o.n));
  if (o.stretch) return { x:o.x, y:o.y, w:o.w, h:o.h };
  const iw = (e.el.naturalWidth  || 32);
  const ih = (e.el.naturalHeight || 32);
  const h  = o.w * ih / iw;
  return { x: o.x, y: o.y + o.h - h, w: o.w, h: h };
}

/* 把一块 32×32 平铺到一片区域 */
function tileArea(t, x0, y0, x1, y1) {
  if (!t) return false;
  const sh = SHEET_BY[t.s];
  if (!sh) return false;
  const s = sheetReady(sh) || getSheet(sh, () => draw());
  if (!s || !s.ok) return false;
  const sx = t.c * 32, sy = t.r * 32;
  for (let y = y0; y < y1; y += TILE) {
    for (let x = x0; x < x1; x += TILE) {
      const w = Math.min(TILE, x1 - x);
      const h = Math.min(TILE, y1 - y);
      ctx.drawImage(s.el, sx, sy, w, h, x, y, w, h);
    }
  }
  return true;
}

function drawRoomBg() {
  const R = ROOM_BY_KEY[curRoom];
  const d = DATA[curRoom];

  /* 墙 */
  if (!tileArea(d.wall, 0, 0, W, WALL_Y)) {
    const wg = ctx.createLinearGradient(0, 0, 0, WALL_Y);
    wg.addColorStop(0, R.wall[0]); wg.addColorStop(1, R.wall[1]);
    ctx.fillStyle = wg; ctx.fillRect(0, 0, W, WALL_Y);
  }
  ctx.fillStyle = "rgba(0,0,0,.10)";
  ctx.fillRect(0, WALL_Y - 8, W, 8);

  /* 地板 */
  if (!tileArea(d.floor, 0, WALL_Y, W, FLOOR.y1)) {
    const fg = ctx.createLinearGradient(0, WALL_Y, 0, FLOOR.y1);
    fg.addColorStop(0, R.floor[0]); fg.addColorStop(1, R.floor[1]);
    ctx.fillStyle = fg; ctx.fillRect(0, WALL_Y, W, FLOOR.y1 - WALL_Y);
    ctx.strokeStyle = R.line; ctx.lineWidth = 1;
    for (let y = WALL_Y + 26; y < FLOOR.y1; y += 26) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    for (let i = 0; i < 9; i++) { const x = 24 + i * 44; ctx.beginPath(); ctx.moveTo(x, WALL_Y); ctx.lineTo(x, FLOOR.y1); ctx.stroke(); }
  }

  /* 铺墙地模式下画一层格线，方便对缝 */
  if (mode === "base") {
    ctx.save();
    ctx.strokeStyle = "rgba(255,214,150,.14)"; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += TILE) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, FLOOR.y1); ctx.stroke(); }
    for (let y = 0; y <= FLOOR.y1; y += TILE) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#14131a"; ctx.fillRect(0, 0, W, H);
  drawRoomBg();

  const list = DATA[curRoom].items;
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    const b = boxOf(o);
    const e = getImg(urlOf(o.c, o.n));
    if (e.ok) {
      ctx.drawImage(e.el, b.x, b.y, b.w, b.h);
    } else {
      ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = "#c79b6d";
      ctx.fillRect(b.x, b.y, b.w, Math.max(10, b.h)); ctx.restore();
    }
    if (mode === "furniture" && i === sel) {
      ctx.save();
      ctx.strokeStyle = "#ffd696"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
      ctx.strokeRect(b.x - 1, b.y - 1, b.w + 2, b.h + 2);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.fillStyle = "rgba(255,214,150,.85)";
  ctx.font = "600 11px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillText(ROOM_BY_KEY[curRoom].label + " · " + list.length + " 件", 10, 10);
  ctx.restore();
}

/* ---------- 家具图库 ---------- */
let scanToken = 0;
function scan(themeKey) {
  const T = THEME_BY_KEY[themeKey];
  const my = ++scanToken;
  lib.innerHTML = "";
  let n = 1;
  (function step() {
    if (my !== scanToken || n > T.max) return;
    const u = urlOf(T.key, n);
    const im = new Image();
    im.onload  = () => { if (my === scanToken) addCell(T.key, n, u); n++; step(); };
    im.onerror = () => { n++; step(); };
    im.src = u;
  })();
}
function addCell(key, num, u) {
  const d  = document.createElement("div");
  d.className = "cell";
  const gi = document.createElement("img"); gi.src = u; gi.loading = "lazy";
  const b  = document.createElement("b");   b.textContent = num;
  d.appendChild(gi); d.appendChild(b);
  d.addEventListener("click", () => {
    DATA[curRoom].items.push({ c:key, n:num, x:120, y:380, w:96, h:90, stretch:false });
    sel = DATA[curRoom].items.length - 1;
    draw(); render();
  });
  lib.appendChild(d);
}

/* ---------- 墙地大表 ---------- */
function buildAtlas() {
  lib.innerHTML = "";

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "点一格 → 铺到「" + ROOM_BY_KEY[curRoom].label + "」的" + (baseTarget === "wall" ? "墙" : "地板") + "上";
  lib.appendChild(hint);

  const st = document.createElement("div");
  st.className = "status" + (sheetStatus.indexOf("读不到") === 0 ? " warn" : "");
  st.textContent = sheetStatus || "正在读大表…";
  lib.appendChild(st);

  const sw = document.createElement("div");
  sw.className = "swatch";
  const sc = document.createElement("canvas");
  sc.width = 32; sc.height = 32;
  const sp = document.createElement("span");
  const cur = DATA[curRoom][baseTarget];
  sp.textContent = cur ? (SHEET_BY[cur.s].label + " 第 " + cur.c + " 列 / 第 " + cur.r + " 行") : "还没铺，下面点一格";
  if (cur) {
    const s = sheetReady(SHEET_BY[cur.s]);
    if (s) sc.getContext("2d").drawImage(s.el, cur.c * 32, cur.r * 32, 32, 32, 0, 0, 32, 32);
  }
  sw.appendChild(sc); sw.appendChild(sp);
  lib.appendChild(sw);

  const sh = SHEET_BY[sheetKey];
  const box = document.createElement("div");
  box.className = "atlasbox";
  const ac = document.createElement("canvas");
  ac.id = "ac";
  ac.width  = sh.cols * atlasTile;
  ac.height = sh.rows * atlasTile;
  box.appendChild(ac);
  lib.appendChild(box);

  drawAtlas();

  ac.addEventListener("click", (ev) => {
    const r = ac.getBoundingClientRect();
    const c  = Math.floor((ev.clientX - r.left) / atlasTile);
    const rr = Math.floor((ev.clientY - r.top ) / atlasTile);
    if (c < 0 || rr < 0 || c >= sh.cols || rr >= sh.rows) return;
    DATA[curRoom][baseTarget] = { s: sheetKey, c: c, r: rr };
    draw(); render(); buildAtlas();
  });

  getSheet(sh, () => { if (document.getElementById("ac")) { drawAtlas(); buildAtlas(); } });
}

function drawAtlas() {
  const ac = document.getElementById("ac");
  if (!ac) return;
  const sh = SHEET_BY[sheetKey];
  const g  = ac.getContext("2d");
  g.imageSmoothingEnabled = false;
  const w = ac.width, h = ac.height;
  g.fillStyle = "#1a1922"; g.fillRect(0, 0, w, h);

  const s = sheetReady(sh);
  if (s) {
    g.drawImage(s.el, 0, 0, w, h);
  } else {
    g.fillStyle = "#8c8494";
    g.font = "12px sans-serif";
    g.fillText("大表读不到 …", 8, 20);
  }

  g.strokeStyle = "rgba(255,214,150,.20)"; g.lineWidth = 1;
  for (let c = 0; c <= sh.cols; c++) { g.beginPath(); g.moveTo(c * atlasTile + .5, 0); g.lineTo(c * atlasTile + .5, h); g.stroke(); }
  for (let r = 0; r <= sh.rows; r++) { g.beginPath(); g.moveTo(0, r * atlasTile + .5); g.lineTo(w, r * atlasTile + .5); g.stroke(); }

  const cur = DATA[curRoom][baseTarget];
  if (cur && cur.s === sheetKey) {
    g.strokeStyle = "#ffd696"; g.lineWidth = 2;
    g.strokeRect(cur.c * atlasTile + 1, cur.r * atlasTile + 1, atlasTile - 2, atlasTile - 2);
  }
}

/* ---------- 拖拽（只在摆家具模式生效） ---------- */
let drag = null;
cv.addEventListener("pointerdown", (ev) => {
  if (mode !== "furniture") return;
  const p = toWorld(ev);
  const list = DATA[curRoom].items;
  for (let i = list.length - 1; i >= 0; i--) {
    const b = boxOf(list[i]);
    if (p.x > b.x - 6 && p.x < b.x + b.w + 6 && p.y > b.y - 6 && p.y < b.y + b.h + 6) {
      sel = i;
      drag = { i: i, dx: p.x - list[i].x, dy: p.y - (list[i].y + list[i].h) };
      cv.setPointerCapture(ev.pointerId);
      draw(); render();
      return;
    }
  }
  sel = -1; drag = null; draw(); render();
});
cv.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const p = toWorld(ev);
  const o = DATA[curRoom].items[drag.i];
  o.x = Math.round(Math.max(-40, Math.min(W - 20, p.x - drag.dx)));
  o.y = Math.round(Math.max(WALL_Y - 60, Math.min(FLOOR.y1, p.y - drag.dy)));
  draw(); render();
});
function stopDrag() { if (drag) { drag = null; render(); } }
cv.addEventListener("pointerup", stopDrag);
cv.addEventListener("pointercancel", stopDrag);

/* ---------- 工具按钮 ---------- */
document.getElementById("del").addEventListener("click", () => {
  if (sel < 0) return;
  const l = DATA[curRoom].items;
  l.splice(sel, 1); sel = -1;
  draw(); render();
});
document.getElementById("narrow").addEventListener("click", () => {
  if (sel < 0) return; const o = DATA[curRoom].items[sel];
  o.w = Math.max(16, Math.round(o.w / 1.12)); draw(); render();
});
document.getElementById("wide").addEventListener("click", () => {
  if (sel < 0) return; const o = DATA[curRoom].items[sel];
  o.w = Math.min(400, Math.round(o.w * 1.12)); draw(); render();
});
document.getElementById("stretch").addEventListener("click", () => {
  if (sel < 0) return; const o = DATA[curRoom].items[sel];
  o.stretch = !o.stretch; draw(); render();
});
document.getElementById("back").addEventListener("click", () => {
  if (sel <= 0) return; const l = DATA[curRoom].items;
  l.unshift(l.splice(sel, 1)[0]); sel = 0; draw(); render();
});
document.getElementById("front").addEventListener("click", () => {
  const l = DATA[curRoom].items;
  if (sel < 0 || sel === l.length - 1) return;
  l.push(l.splice(sel, 1)[0]); sel = l.length - 1; draw(); render();
});

/* ---------- 模式切换 ---------- */
const mFur    = document.getElementById("mFur");
const mBase   = document.getElementById("mBase");
const baseCtl = document.getElementById("baseCtl");
const toolRow = document.getElementById("toolRow");
const themeSel= document.getElementById("theme");
const tipEl   = document.getElementById("tip");

function setMode(m) {
  mode = m;
  const isBase = (m === "base");
  mFur.classList.toggle("on", !isBase);
  mBase.classList.toggle("on", isBase);
  baseCtl.style.display = isBase ? "flex" : "none";
  toolRow.style.display = isBase ? "none" : "flex";
  themeSel.style.display = isBase ? "none" : "";
  document.body.classList.toggle("base", isBase);

  if (isBase) {
    tipEl.textContent = "选「贴墙」或「贴地」→ 左边大表点一格 → 立刻铺上。不满意再点一格；想清掉就按「清掉这一层」。";
    sel = -1;
    buildAtlas();
  } else {
    tipEl.textContent = "左边点一下 → 进屋子；拖屋里那件 → 挪位置；点中会亮黄边。";
    scan(themeSel.value);
  }
  draw(); render();
}
mFur.addEventListener("click",  () => setMode("furniture"));
mBase.addEventListener("click", () => setMode("base"));

/* 贴哪儿 */
const tWall  = document.getElementById("tWall");
const tFloor = document.getElementById("tFloor");
tWall.addEventListener("click", () => {
  baseTarget = "wall";
  tWall.classList.add("on"); tFloor.classList.remove("on");
  buildAtlas();
});
tFloor.addEventListener("click", () => {
  baseTarget = "floor";
  tFloor.classList.add("on"); tWall.classList.remove("on");
  buildAtlas();
});

/* 换素材表 */
const sheetSel = document.getElementById("sheet");
SHEETS.forEach(s => {
  const o = document.createElement("option");
  o.value = s.key; o.textContent = s.label;
  sheetSel.appendChild(o);
});
sheetSel.addEventListener("change", () => { sheetKey = sheetSel.value; buildAtlas(); });

/* 大表格子大小 */
function setZoom(t) { atlasTile = t; buildAtlas(); }
document.getElementById("zS").addEventListener("click", () => setZoom(12));
document.getElementById("zM").addEventListener("click", () => setZoom(20));
document.getElementById("zL").addEventListener("click", () => setZoom(30));

/* 清掉当前这一层 */
document.getElementById("clrBase").addEventListener("click", () => {
  DATA[curRoom][baseTarget] = null;
  draw(); render(); buildAtlas();
});

/* ---------- 复制清单 ---------- */
const copyBtn = document.getElementById("copy");
copyBtn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(out.value);
    copyBtn.textContent = "复制好了 ✓";
  } catch (e) {
    out.select();
    copyBtn.textContent = "长按上面复制";
  }
  setTimeout(() => { copyBtn.textContent = "复制清单"; }, 1600);
});

/* ---------- 清单输出 ---------- */
function render() {
  const d = DATA[curRoom];
  const L = ["// " + ROOM_BY_KEY[curRoom].label];
  const b = [];
  if (d.wall)  b.push('wall:{ s:"'  + d.wall.s  + '", c:' + d.wall.c  + ', r:' + d.wall.r  + ' }');
  if (d.floor) b.push('floor:{ s:"' + d.floor.s + '", c:' + d.floor.c + ', r:' + d.floor.r + ' }');
  if (b.length) L.push("base: { " + b.join(", ") + " },");
  if (d.items.length) {
    L.push("items: [");
    d.items.forEach(o => {
      L.push('  { c:"' + o.c + '", n:' + o.n + ', x:' + o.x + ', y:' + o.y +
             ', w:' + o.w + ', h:' + o.h + (o.stretch ? ", stretch:true" : "") + " },");
    });
    L.push("],");
  }
  out.value = L.join("\n");
}

/* ---------- 房间与主题下拉 ---------- */
const roomSel = document.getElementById("room");
ROOMS.forEach(r => {
  const o = document.createElement("option");
  o.value = r.key; o.textContent = r.label;
  roomSel.appendChild(o);
});
roomSel.addEventListener("change", () => {
  curRoom = roomSel.value; sel = -1;
  if (mode === "base") buildAtlas();
  draw(); render();
});

THEMES.forEach(t => {
  const o = document.createElement("option");
  o.value = t.key; o.textContent = t.label;
  themeSel.appendChild(o);
});
themeSel.addEventListener("change", () => { if (mode === "furniture") scan(themeSel.value); });

/* ---------- 起步 ---------- */
scan(THEMES[0].key);
fit();
render();
</script>
</body>
</html>
