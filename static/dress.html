<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>换装台 · dress</title>
<style>
  :root{--bg:#14131a;--card:#1e1c26;--line:#2e2b38;--ink:#e8e2ee;--dim:#9d94a6;--hot:#ffd696}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(20,19,26,.97);
    border-bottom:1px solid var(--line);padding:10px 12px}
  h1{margin:0 0 8px;font-size:15px;font-weight:600}
  h1 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .hint{color:var(--dim);font-size:12px}
  .hint b{color:var(--hot);font-weight:600}
  .stagewrap{display:flex;gap:14px;align-items:flex-start;padding:12px;flex-wrap:wrap}
  .stagel{flex:0 0 auto}
  .stage{image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;
    width:252px;height:252px;
    background-color:#1a1822;
    background-image:linear-gradient(45deg,#24222e 25%,transparent 25%,transparent 75%,#24222e 75%),
                     linear-gradient(45deg,#24222e 25%,transparent 25%,transparent 75%,#24222e 75%);
    background-size:16px 16px;background-position:0 0,8px 8px}
  .zoombar{display:flex;gap:6px;margin-top:8px;justify-content:center;flex-wrap:wrap}
  .layers{flex:1 1 280px;min-width:250px;display:flex;flex-direction:column;gap:8px}
  .lay{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .lay h2{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--hot)}
  .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .row + .row{margin-top:6px}
  select,input,button{font:inherit;background:#11101a;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  input[type=number]{width:52px}
  .row label{color:var(--dim);font-size:12px;white-space:nowrap}
  .on{background:#3a4a63;border-color:#4a5f80}
  .chk{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;white-space:nowrap}
  .out{padding:0 12px 24px}
  textarea{width:100%;height:180px;background:#11101a;color:#b8f0c0;
    border:1px solid var(--line);border-radius:8px;padding:8px;
    font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
</style>
</head>
<body>
<header>
  <h1>换装台 <small>叠起来看</small></h1>
  <div class="hint">顺序：<b>身体 → 衣服 → 头发 → 眼睛</b>。每层选一张、填一格，还能加<b>第二块</b>（有些头发跨两格）。<br>
  <b>挪X / 挪Y</b> 按原图像素算，正数往右下；一格 = 32。<br>
  现有：身体 9 / 眼睛 7 / 头发 29 / 衣服 33（2026-10-11 点的数）。</div>
</header>

<div class="stagewrap">
  <div class="stagel">
    <canvas class="stage" id="stage" width="252" height="252"></canvas>
    <div class="zoombar" id="zoombar"></div>
  </div>
  <div class="layers" id="layers"></div>
</div>

<div class="out"><textarea id="out" readonly></textarea></div>

<script>
"use strict";
/* ============================================================
   换装台 · dress
   每层 = 一张表 + 第一块（行/列/挪X/挪Y）+ 可选第二块（行/列/挪X/挪Y）
   偏移单位 = 原图 32×32 像素
   素材：Tiles by LimeZu — https://limezu.itch.io/
   ============================================================ */

const CG = "tiles/2_Characters/Character_Generator/";

const LAYERS = [
  { key: "body",   title: "① 身体 Body（9 个肤色）", dir: "Bodies/32x32/",     prefix: "Body_32x32_", count: 9,  p1: { row: 1, col: 3, dx: 0,  dy: 0 },  p2: null },
  { key: "outfit", title: "② 衣服 Outfit（33 件）",  dir: "Outfits/32x32/",    prefix: "Outfit_",     count: 33, p1: { row: 1, col: 3, dx: 0,  dy: 0 },  p2: null, suffix: "_32x32_01" },
  { key: "hair",   title: "③ 头发 Hair（29 种）",    dir: "Hairstyles/32x32/", prefix: "Hairstyle_",  count: 29, p1: { row: 8, col: 3, dx: 0,  dy: -32 }, p2: { row: 9, col: 3, dx: 0, dy: 0 }, suffix: "_32x32_01" },
  { key: "eyes",   title: "④ 眼睛 Eyes（7 种）",     dir: "Eyes/32x32/",       prefix: "Eyes_32x32_", count: 7,  p1: { row: 1, col: 3, dx: 0,  dy: 0 },  p2: null }
];

const CELL = 32;
const VIEWS = [3, 5, 7];
let viewIdx = 1;

const stage = document.getElementById("stage");
const sctx  = stage.getContext("2d");
sctx.imageSmoothingEnabled = false;

const outEl = document.getElementById("out");
const layersEl = document.getElementById("layers");
const zoombar = document.getElementById("zoombar");

const cache = Object.create(null);
function getImg(path) {
  let e = cache[path];
  if (!e) {
    e = cache[path] = { el: new Image(), ok: false };
    e.el.onload  = () => { e.ok = true; draw(); };
    e.el.onerror = () => { e.ok = false; draw(); };
    e.el.src = CG + path;
  }
  return e;
}

function optionsFor(L) {
  const arr = [];
  for (let i = 1; i <= L.count; i++) {
    const num = String(i).padStart(2, "0");
    arr.push(L.dir + L.prefix + num + (L.suffix || "") + ".png");
  }
  return arr;
}

const state = {};

LAYERS.forEach((L) => {
  state[L.key] = {
    L, file: optionsFor(L)[0],
    p1: Object.assign({}, L.p1),
    p2: L.p2 ? Object.assign({}, L.p2) : { row: 0, col: 3, dx: 0, dy: 32 },
    use2: !!L.p2
  };

  const box = document.createElement("div");
  box.className = "lay";

  const h = document.createElement("h2");
  h.textContent = L.title;

  /* 选文件 */
  const r1 = document.createElement("div");
  r1.className = "row";
  const sel = document.createElement("select");
  optionsFor(L).forEach((f) => {
    const o = document.createElement("option");
    o.value = f; o.textContent = f.split("/").pop();
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { state[L.key].file = sel.value; draw(); });
  r1.appendChild(sel);

  /* 第一块 */
  const r2 = document.createElement("div");
  r2.className = "row";
  const t1 = document.createElement("label"); t1.textContent = "①"; r2.appendChild(t1);
  function num(parent, label, get, set, step) {
    const lb = document.createElement("label"); lb.textContent = label;
    const inp = document.createElement("input");
    inp.type = "number"; inp.value = String(get());
    inp.addEventListener("input", () => { set(Number(inp.value) || 0); draw(); });
    parent.appendChild(lb); parent.appendChild(inp);
  }
  num(r2, "行", () => state[L.key].p1.row, (v) => state[L.key].p1.row = v);
  num(r2, "列", () => state[L.key].p1.col, (v) => state[L.key].p1.col = v);
  num(r2, "挪X", () => state[L.key].p1.dx, (v) => state[L.key].p1.dx = v);
  num(r2, "挪Y", () => state[L.key].p1.dy, (v) => state[L.key].p1.dy = v);

  /* 第二块 */
  const r3 = document.createElement("div");
  r3.className = "row";
  const chk = document.createElement("input");
  chk.type = "checkbox"; chk.checked = state[L.key].use2;
  chk.addEventListener("change", () => { state[L.key].use2 = chk.checked; draw(); });
  const chkl = document.createElement("label"); chkl.className = "chk";
  chkl.appendChild(chk);
  const chkt = document.createElement("span"); chkt.textContent = "加第二块 ②"; chkl.appendChild(chkt);
  r3.appendChild(chkl);
  num(r3, "行", () => state[L.key].p2.row, (v) => state[L.key].p2.row = v);
  num(r3, "列", () => state[L.key].p2.col, (v) => state[L.key].p2.col = v);
  num(r3, "挪X", () => state[L.key].p2.dx, (v) => state[L.key].p2.dx = v);
  num(r3, "挪Y", () => state[L.key].p2.dy, (v) => state[L.key].p2.dy = v);

  box.appendChild(h); box.appendChild(r1); box.appendChild(r2); box.appendChild(r3);
  layersEl.appendChild(box);
});

VIEWS.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v + " 格";
  if (i === viewIdx) b.classList.add("on");
  b.addEventListener("click", () => {
    viewIdx = i;
    Array.from(zoombar.children).forEach((c, k) => c.classList.toggle("on", k === i));
    draw();
  });
  zoombar.appendChild(b);
});

function piece(st, img, p, cx, cy, s) {
  if (!img.ok) return;
  sctx.drawImage(img.el,
    p.col * CELL, p.row * CELL, CELL, CELL,
    cx + p.dx * s, cy + p.dy * s, CELL * s, CELL * s);
}

function draw() {
  const view = VIEWS[viewIdx];
  const span = view * CELL;
  const s = stage.width / span;
  const cx = stage.width  / 2 - CELL * s / 2;
  const cy = stage.height / 2 - CELL * s / 2;

  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.clearRect(0, 0, stage.width, stage.height);
  sctx.imageSmoothingEnabled = false;

  /* 参考网格 + 中心黄框 */
  sctx.strokeStyle = "rgba(255,255,255,.09)";
  sctx.lineWidth = 1;
  for (let i = 0; i <= view; i++) {
    const p = i * CELL * s;
    sctx.beginPath(); sctx.moveTo(p, 0); sctx.lineTo(p, stage.height); sctx.stroke();
    sctx.beginPath(); sctx.moveTo(0, p); sctx.lineTo(stage.width, p); sctx.stroke();
  }
  sctx.strokeStyle = "rgba(255,214,150,.5)";
  sctx.lineWidth = 2;
  sctx.strokeRect(cx, cy, CELL * s, CELL * s);

  const lines = [];
  for (const L of LAYERS) {
    const st = state[L.key];
    const im = getImg(st.file);
    piece(st, im, st.p1, cx, cy, s);
    if (st.use2) piece(st, im, st.p2, cx, cy, s);

    const fn = st.file.split("/").pop();
    let line = (L.key + ":").padEnd(8) + " " + fn +
               "  ①行" + st.p1.row + " 列" + st.p1.col + " 挪" + st.p1.dx + "/" + st.p1.dy;
    if (st.use2) line += "  ②行" + st.p2.row + " 列" + st.p2.col + " 挪" + st.p2.dx + "/" + st.p2.dy;
    lines.push(line);
  }
  const ok = LAYERS.filter((L) => getImg(state[L.key].file).ok).length;
  outEl.value = "/* 复制整段发给清泽 */\n" + lines.join("\n") +
                "\n\n叠上了 " + ok + "/4 层 · 视野 " + view + " 格";
}

draw();
</script>
</body>
</html>
