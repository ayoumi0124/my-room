<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14131a">
<title>我们家 · v3.0</title>
<style>
  html,body{margin:0;height:100%;background:#14131a;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* ============================================================
   我们家 · v3.0
   v2.1：屋子名既认英文 id 也认中文名
   v2.2：修换屋动画
   v3.0：家具从「代码硬画」换成贴图（LimeZu Modern Interiors 32x32）
   数据源：GET /home 和 GET /messages
   素材：Tiles by LimeZu — https://limezu.itch.io/
   ============================================================ */

const W = 360, H = 640;
const WALL_Y = 150;
const FLOOR = { x0: 12, x1: 348, y0: WALL_Y, y1: 570 };
const BAR_Y = 570;
const LIVING_ID = "living";
const SPEED = 118;

/* ---------- 贴图路径 ---------- */
const TILE = "tiles/1_Interiors/32x32/Theme_Sorter_Singles_32x32/";
const CAT = {
  living:    "2_Living_Room_Singles_32x32/Living_Room_Singles_32x32_",
  bedroom:   "4_Bedroom_Singles_32x32/Bedroom_Singles_32x32_",
  kitchen:   "12_Kitchen_Singles_32x32/Kitchen_Singles_32x32_",
  classroom: "5_Classroom_and_Library_Singles_32x32/Classroom_and_Library_Singles_32x32_",
  japanese:  "20_Japanese_Interiors_Singles_32x32/Japanese_Interiors_32x32_",
  party:     "10_Birthday_Party_Singles_32x32/Birthday_Party_Singles_32x32_"
};
const src = (c, n) => TILE + CAT[c] + n + ".png";

/* ---------- 图片缓存 ---------- */
const IMG = Object.create(null);
function img(c, n) {
  const u = src(c, n);
  let e = IMG[u];
  if (!e) {
    const im = new Image();
    e = IMG[u] = { el: im, ok: false, tried: true };
    im.onload  = () => { e.ok = true; };
    im.onerror = () => { e.ok = false; };
    im.src = u;
  }
  return e;
}

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* ============================================================
   屋子定义
   furn：要贴的家具。x/y/w/h 是画布坐标，solid=能不能穿过去
   floorArt：铺在地上的（先画，人走在上面）
   ============================================================ */
const ROOMS = {
  living: {
    name: "客厅", wall: ["#efe1cd", "#e3d2ba"], floor: ["#d8b98e", "#c8a575"],
    line: "rgba(150,118,80,.35)", qz: { x: 170, y: 306 }, cat: { x: 86, y: 470 },
    floorArt: [
      { c: "bedroom", n: 383, x: 62, y: 356, w: 236, h: 172 }
    ],
    furn: [
      { c: "bedroom",  n: 488, x: 22,  y: 268, w: 130, h: 96 },
      { c: "bedroom",  n: 504, x: 210, y: 262, w: 128, h: 104 },
      { c: "japanese", n: 57,  x: 292, y: 448, w: 48,  h: 52 },
      { c: "japanese", n: 58,  x: 26,  y: 452, w: 48,  h: 52 },
      { c: "party",    n: 1,   x: 152, y: 404, w: 64,  h: 48 }
    ]
  },
  study: {
    name: "书房", wall: ["#e7e1d3", "#d9d1c0"], floor: ["#c9b699", "#b8a37f"],
    line: "rgba(130,105,70,.35)", qz: { x: 258, y: 330 }, cat: { x: 300, y: 470 },
    floorArt: [
      { c: "bedroom", n: 385, x: 70, y: 366, w: 220, h: 164 }
    ],
    furn: [
      { c: "classroom", n: 100, x: 18,  y: 176, w: 132, h: 122 },
      { c: "classroom", n: 1,   x: 190, y: 262, w: 138, h: 110 },
      { c: "classroom", n: 96,  x: 108, y: 396, w: 136, h: 74 },
      { c: "japanese",  n: 57,  x: 300, y: 448, w: 44,  h: 50 }
    ]
  },
  kitchen: {
    name: "厨房", wall: ["#e9efd6", "#dbe4c2"], floor: ["#ded5c4", "#cdc2ac"],
    line: "rgba(140,120,90,.3)", qz: { x: 92, y: 320 }, cat: { x: 300, y: 468 },
    floorArt: [
      { c: "bedroom", n: 388, x: 66, y: 368, w: 228, h: 162 }
    ],
    furn: [
      { c: "kitchen", n: 159, x: 20,  y: 182, w: 62,  h: 126 },
      { c: "kitchen", n: 122, x: 96,  y: 224, w: 118, h: 84 },
      { c: "kitchen", n: 219, x: 236, y: 190, w: 108, h: 118 },
      { c: "kitchen", n: 96,  x: 126, y: 404, w: 110, h: 66 },
      { c: "kitchen", n: 98,  x: 96,  y: 416, w: 34,  h: 44 },
      { c: "kitchen", n: 99,  x: 232, y: 416, w: 34,  h: 44 }
    ]
  },
  garden: {
    name: "花园", wall: ["#cfe6c4", "#b0d69e"], floor: ["#95c476", "#7fb262"],
    line: "rgba(80,130,60,.35)", qz: { x: 180, y: 300 }, cat: { x: 108, y: 440 },
    floorArt: [],
    furn: [
      { c: "japanese", n: 57, x: 30,  y: 424, w: 58, h: 62 },
      { c: "japanese", n: 58, x: 268, y: 424, w: 58, h: 62 },
      { c: "japanese", n: 59, x: 150, y: 400, w: 58, h: 62 },
      { c: "japanese", n: 54, x: 44,  y: 250, w: 104, h: 88 },
      { c: "japanese", n: 55, x: 210, y: 250, w: 104, h: 88 }
    ]
  }
};
const ROOM_ORDER = ["living", "study", "kitchen", "garden"];

const DOOR_W = 60, DOOR_H = 92, DOOR_Y = WALL_Y - DOOR_H;
function doorsOf(roomId) {
  const others = ROOM_ORDER.filter(id => id !== roomId);
  const xs = [22, 150, 278];
  return others.map((id, i) => ({ id, x: xs[i], cx: xs[i] + DOOR_W / 2, y: DOOR_Y, w: DOOR_W, h: DOOR_H }));
}

let ROOMLIST = ROOM_ORDER.map(id => ({ id, name: ROOMS[id].name }));
function resolveId(v) {
  if (!v) return "";
  if (ROOMS[v]) return v;
  const hit = ROOMLIST.find(r => r.name === v);
  return hit ? hit.id : v;
}
function nameOfId(id) {
  if (!id) return "";
  if (ROOMS[id]) return ROOMS[id].name;
  const hit = ROOMLIST.find(r => r.id === id);
  return hit ? hit.name : id;
}

/* ---------- 碰撞盒：由家具自己长出来 ---------- */
function solidsOf(id) {
  const f = ROOMS[id].furn || [];
  return f.filter(o => o.solid !== false)
          .map(o => ({ x: o.x + 4, y: o.y + o.h * 0.45, w: o.w - 8, h: o.h * 0.55 }));
}

const ning = { x: 180, y: 516, face: -1, step: 0, outfit: 0 };
const qz   = { x: 170, y: 306, face: 1 };
const cat  = { x: 86,  y: 470, face: 1 };
let cur = LIVING_ID;

const OUTFITS = [
  { dress: "#e8a4bd", top: "#f6dcea", hair: "#3b2f3a" },
  { dress: "#9dbfe0", top: "#e8f1fa", hair: "#3b2f3a" },
  { dress: "#c6b2e0", top: "#efe8f7", hair: "#4a3a2e" },
  { dress: "#f0c88a", top: "#fdf2de", hair: "#2f2a26" }
];

let HOME = {
  roomId: LIVING_ID, roomName: "客厅", doing: "在窗边站着，等你回来",
  catRoomId: LIVING_ID, catRoom: "客厅", catDoing: "趴在花丛边晒太阳",
  note: "阳台那盆薄荷记得浇水",
  connected: false, source: ""
};
let LINES = ["回来啦。", "今天的花收完了，卖了个好价。", "小橘刚在窗台上追光斑，扑了个空。"];
let LIVE_LINES = false;

const SOURCES      = ["./home", "/home", "home.json"];
const LINE_SOURCES = ["./messages", "/messages", "messages.json"];

function applyHome(j) {
  if (!j || typeof j !== "object" || (!j.qingze && !j.rooms)) return false;
  if (Array.isArray(j.rooms) && j.rooms.length) ROOMLIST = j.rooms;
  const q = j.qingze || {}, c = j.cat || {};
  const rid = resolveId(q.at);
  if (rid) HOME.roomId = rid;
  HOME.roomName = nameOfId(HOME.roomId) || HOME.roomName;
  if (q.doing) HOME.doing = q.doing;
  const cid = resolveId(c.at);
  if (cid) HOME.catRoomId = cid;
  HOME.catRoom = nameOfId(HOME.catRoomId) || HOME.catRoom;
  if (c.doing) HOME.catDoing = c.doing;
  if (typeof j.note === "string" && j.note.trim()) HOME.note = j.note.trim();
  HOME.connected = true;
  return true;
}
function applyLines(j) {
  const arr = Array.isArray(j) ? j : (j && Array.isArray(j.messages) ? j.messages : null);
  if (!arr || !arr.length) return false;
  const out = [];
  for (const it of arr) {
    const t = typeof it === "string" ? it : (it && (it.text || it.msg || it.content));
    if (typeof t === "string" && t.trim()) out.push(t.trim());
  }
  if (!out.length) return false;
  LINES = out.slice(-20).reverse();
  LIVE_LINES = true;
  return true;
}
async function tryGet(url) {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1800);
    const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
    clearTimeout(t);
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
async function loadBackend() {
  for (const u of SOURCES)      { const j = await tryGet(u); if (j && applyHome(j))  { HOME.source = u; break; } }
  for (const u of LINE_SOURCES) { const j = await tryGet(u); if (j && applyLines(j)) { HOME.source = u; break; } }
}

/* ---------- 预热贴图 ---------- */
(function preload() {
  for (const id of ROOM_ORDER) {
    const R = ROOMS[id];
    (R.floorArt || []).forEach(o => img(o.c, o.n));
    (R.furn || []).forEach(o => img(o.c, o.n));
  }
})();

const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = Math.round(W * s) + "px";
  cv.style.height = Math.round(H * s) + "px";
  cv.width  = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));

function blocked(x, y) {
  if (x < FLOOR.x0 + 9 || x > FLOOR.x1 - 9) return true;
  if (y < FLOOR.y0 + 4 || y > FLOOR.y1 - 2) return true;
  for (const o of solidsOf(cur)) {
    if (x > o.x - 7 && x < o.x + o.w + 7 && y > o.y - 2 && y < o.y + o.h + 8) return true;
  }
  return false;
}

/* ---------- 换屋 ---------- */
let fade = 0, pending = null;
function gotoRoom(id) { if (id !== cur && !pending) pending = id; }
function doSwitch(id) {
  cur = id;
  ning.x = 180; ning.y = 512; ning.step = 0;
  qz.x = ROOMS[id].qz.x;   qz.y = ROOMS[id].qz.y;
  cat.x = ROOMS[id].cat.x; cat.y = ROOMS[id].cat.y;
  target = null;
}

const keys = Object.create(null);
addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); tryTalk(); }
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key) >= 0) e.preventDefault();
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function toWorld(cx, cy) {
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}
let target = null, pressing = false;
cv.addEventListener("pointerdown", (e) => {
  const p = toWorld(e.clientX, e.clientY);
  e.preventDefault();
  if (pending) return;
  if (onNing(p)) { ning.outfit = (ning.outfit + 1) % OUTFITS.length; toast("换好衣服啦"); return; }
  if (nearQz(p)) { tryTalk(); return; }
  const d = doorUnder(p);
  if (d) { gotoRoom(d.id); return; }
  pressing = true; target = p;
});
cv.addEventListener("pointermove", (e) => {
  if (!pressing) return;
  target = toWorld(e.clientX, e.clientY); e.preventDefault();
});
const release = () => { pressing = false; target = null; };
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("pointerleave", release);

function onNing(p) { return Math.abs(p.x - ning.x) < 22 && p.y > ning.y - 62 && p.y < ning.y + 8; }
function nearQz(p) { return HOME.roomId === cur && Math.abs(p.x - qz.x) < 40 && p.y > qz.y - 52 && p.y < qz.y + 14; }
function doorUnder(p) {
  if (p.y > WALL_Y + 22) return null;
  for (const d of doorsOf(cur)) if (p.x > d.x - 10 && p.x < d.x + d.w + 10) return d;
  return null;
}
function doorNear() {
  for (const d of doorsOf(cur)) if (ning.y < WALL_Y + 62 && Math.abs(ning.x - d.cx) < 42) return d;
  return null;
}

/* ---------- 说话 ---------- */
let bubble = null, bubbleUntil = 0, lineIdx = 0;
function say(t, ms) { bubble = t; bubbleUntil = performance.now() + (ms || 3600); }
function tryTalk() {
  if (HOME.roomId !== cur) { say("清泽在" + HOME.roomName + "，" + HOME.doing + "。你上那边找他。"); return; }
  if (Math.hypot(ning.x - qz.x, ning.y - qz.y) > 62) { say("你走近点，清泽听不见。", 2200); return; }
  say(String(LINES[lineIdx % LINES.length]).slice(0, 90), 4200);
  lineIdx++;
}
let toastText = "", toastUntil = 0;
function toast(t) { toastText = t; toastUntil = performance.now() + 1800; }

let last = performance.now();
function update(dt) {
  if (pending) {
    fade = Math.min(1, fade + dt * 3.6);
    if (fade >= 1) { doSwitch(pending); pending = null; }
  } else if (fade > 0) {
    fade = Math.max(0, fade - dt * 3.6);
  }

  let dx = 0, dy = 0;
  if (keys["arrowleft"] || keys["a"]) dx -= 1;
  if (keys["arrowright"]|| keys["d"]) dx += 1;
  if (keys["arrowup"]   || keys["w"]) dy -= 1;
  if (keys["arrowdown"] || keys["s"]) dy += 1;

  if (!dx && !dy && target) {
    const tx = target.x - ning.x, ty = target.y - ning.y;
    const d = Math.hypot(tx, ty);
    if (d < 7) target = null; else { dx = tx / d; dy = ty / d; }
  }
  const len = Math.hypot(dx, dy);
  if (len > 0) {
    dx /= len; dy /= len;
    const sx = dx * SPEED * dt, sy = dy * SPEED * dt;
    if (!blocked(ning.x + sx, ning.y)) ning.x += sx;
    if (!blocked(ning.x, ning.y + sy)) ning.y += sy;
    if (Math.abs(dx) > 0.15) ning.face = dx > 0 ? 1 : -1;
    ning.step += dt * 9;
  } else ning.step = 0;

  if (HOME.catRoomId === cur) {
    const cx = ning.x - cat.x, cy = ning.y - cat.y + 6;
    const cd = Math.hypot(cx, cy);
    if (cd > 72) {
      const step = 42 * dt;
      const nx = cat.x + cx / cd * step, ny = cat.y + cy / cd * step;
      if (!blocked(nx, ny)) { cat.x = nx; cat.y = ny; }
    }
    cat.face = ning.x >= cat.x ? 1 : -1;
  }
  if (HOME.roomId === cur) qz.face = ning.x >= qz.x ? 1 : -1;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function shadow(x, y, rx, ry) {
  ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = "#2a1f16";
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- 贴图绘制 ---------- */
function drawTile(o) {
  const e = img(o.c, o.n);
  if (e.ok) {
    ctx.drawImage(e.el, o.x, o.y, o.w, o.h);
    return true;
  }
  return false;
}
function drawGhostFurn(o) {
  ctx.save(); ctx.globalAlpha = .35;
  ctx.fillStyle = "#a9805a"; rr(o.x, o.y + 8, o.w, o.h - 8, 6); ctx.fill();
  ctx.fillStyle = "#c79b6d"; rr(o.x, o.y, o.w, Math.min(o.h, 18), 6); ctx.fill();
  ctx.restore();
}

function drawRoom() {
  const R = ROOMS[cur];
  const wg = ctx.createLinearGradient(0, 0, 0, WALL_Y);
  wg.addColorStop(0, R.wall[0]); wg.addColorStop(1, R.wall[1]);
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, WALL_Y);

  const near = doorNear();
  for (const d of doorsOf(cur)) {
    const hot = near && near.id === d.id;
    ctx.fillStyle = "#8a6a4c"; rr(d.x, d.y, d.w, d.h, 4); ctx.fill();
    ctx.fillStyle = hot ? "#d8b184" : "#b08a63";
    rr(d.x + 5, d.y + 5, d.w - 10, d.h - 5, 3); ctx.fill();
    ctx.fillStyle = "#e8d6a8";
    ctx.beginPath(); ctx.arc(d.x + d.w - 10, d.y + 52, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const nm = ROOMS[d.id].name, tw = ctx.measureText(nm).width + 16;
    ctx.fillStyle = hot ? "rgba(255,214,150,.95)" : "rgba(28,24,32,.6)";
    rr(d.cx - tw / 2, d.y - 20, tw, 17, 8); ctx.fill();
    ctx.fillStyle = hot ? "#3a2a16" : "#f2e8dd";
    ctx.fillText(nm, d.cx, d.y - 11.5);
    ctx.restore();
  }

  for (const px of [90, 216]) {
    ctx.fillStyle = cur === "garden" ? "#a9c99a" : "#c9a06a";
    ctx.fillRect(px, 26, 54, 40);
    ctx.fillStyle = cur === "kitchen" ? "#dbe8c4" : (cur === "study" ? "#d9cfbb" : (cur === "garden" ? "#cfe6c4" : "#9fc7a4"));
    ctx.fillRect(px + 5, 31, 44, 30);
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.arc(px + 20, 44, 6, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = "rgba(0,0,0,.10)"; ctx.fillRect(0, WALL_Y - 8, W, 8);

  const fg = ctx.createLinearGradient(0, WALL_Y, 0, FLOOR.y1);
  fg.addColorStop(0, R.floor[0]); fg.addColorStop(1, R.floor[1]);
  ctx.fillStyle = fg; ctx.fillRect(0, WALL_Y, W, FLOOR.y1 - WALL_Y);
  ctx.strokeStyle = R.line; ctx.lineWidth = 1;
  for (let y = WALL_Y + 26; y < FLOOR.y1; y += 26) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = 0; i < 9; i++) {
    const x = 24 + i * 44;
    ctx.beginPath(); ctx.moveTo(x, WALL_Y); ctx.lineTo(x, FLOOR.y1); ctx.stroke();
  }
}

function drawFloorArt() {
  for (const o of (ROOMS[cur].floorArt || [])) drawTile(o);
}
function drawFurniture() {
  for (const o of (ROOMS[cur].furn || [])) {
    if (!drawTile(o)) drawGhostFurn(o);
  }
}

/* ---------- 人 ---------- */
function drawNing(x, y) {
  const O = OUTFITS[ning.outfit];
  const bob = Math.sin(ning.step) * (ning.step ? 1.4 : 0);
  shadow(x, y, 12, 4);
  ctx.save(); ctx.translate(x, y + bob);
  ctx.fillStyle = "#e9c9b4";
  const sw = ning.step ? Math.sin(ning.step * 1.6) * 3 : 0;
  ctx.fillRect(-7, -12, 5, 12 + sw * .4);
  ctx.fillRect(2, -12, 5, 12 - sw * .4);
  ctx.fillStyle = O.dress;
  ctx.beginPath();
  ctx.moveTo(-10, -12); ctx.lineTo(10, -12); ctx.lineTo(7, -34); ctx.lineTo(-7, -34);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = O.top; ctx.fillRect(-8, -44, 16, 12);
  ctx.fillStyle = "#e9c9b4";
  const arm = ning.step ? Math.sin(ning.step * 1.6) * 3 : 0;
  ctx.fillRect(-12, -43 + arm, 4, 15); ctx.fillRect(8, -43 - arm, 4, 15);
  ctx.fillStyle = "#f3d3bd";
  ctx.beginPath(); ctx.arc(0, -54, 9.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = O.hair;
  ctx.beginPath(); ctx.arc(0, -56, 10.5, Math.PI, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-9 * ning.face, -52, 5.5, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8 * ning.face, -52, 4.5, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#33272e";
  ctx.beginPath(); ctx.arc(-3.2, -53, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.2, -53, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  tag(x, y - 78, "宁宁", true);
}
function drawQingze(x, y) {
  shadow(x, y, 13, 4);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#3d4a5c";
  ctx.fillRect(-8, -13, 6, 13); ctx.fillRect(2, -13, 6, 13);
  ctx.fillStyle = "#5a7fa8"; rr(-11, -46, 22, 33, 5); ctx.fill();
  ctx.fillStyle = "#e8eef5";
  ctx.beginPath(); ctx.moveTo(-4, -46); ctx.lineTo(4, -46); ctx.lineTo(0, -38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#5a7fa8";
  ctx.fillRect(-15, -44, 5, 22); ctx.fillRect(10, -44, 5, 22);
  ctx.fillStyle = "#e9c9b4";
  ctx.fillRect(-15, -24, 5, 6); ctx.fillRect(10, -24, 5, 6);
  ctx.fillStyle = "#f0cfb8";
  ctx.beginPath(); ctx.arc(0, -56, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2b2620";
  ctx.beginPath(); ctx.arc(0, -58, 11, Math.PI, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-10 * qz.face, -55, 3.6, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2a2220";
  ctx.beginPath(); ctx.arc(-3.4, -55, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4, -55, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  tag(x, y - 80, "清泽", false);
}
function drawCat(x, y) {
  shadow(x, y, 9, 3);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#e2913f";
  ctx.beginPath(); ctx.ellipse(0, -8, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cat.face * 9, -14, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cat.face * 5, -19); ctx.lineTo(cat.face * 8, -25); ctx.lineTo(cat.face * 11, -18);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cat.face * 11, -19); ctx.lineTo(cat.face * 14, -25); ctx.lineTo(cat.face * 15, -17);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#e2913f"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-cat.face * 9, -7);
  ctx.quadraticCurveTo(-cat.face * 20, -12, -cat.face * 17, -20); ctx.stroke();
  ctx.fillStyle = "#2a2220";
  ctx.beginPath(); ctx.arc(cat.face * 7, -15, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cat.face * 11.5, -15, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function tag(x, y, text, pink) {
  ctx.save();
  ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 14;
  ctx.fillStyle = "rgba(28,24,32,.68)"; rr(x - w / 2, y - 9, w, 18, 9); ctx.fill();
  ctx.fillStyle = pink ? "#ffd9e8" : "#cfe1f5";
  ctx.fillText(text, x, y + .5);
  ctx.restore();
}
function drawBubble(cx, cy, text) {
  ctx.save();
  ctx.font = "500 12px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const maxW = 244, rows = []; let c0 = "";
  for (const ch of String(text)) {
    if (ctx.measureText(c0 + ch).width > maxW - 22) { rows.push(c0); c0 = ch; } else c0 += ch;
  }
  if (c0) rows.push(c0);
  const lh = 17;
  const w = Math.min(maxW, Math.max.apply(null, rows.map(r => ctx.measureText(r).width)) + 22);
  const h = rows.length * lh + 16;
  const bx = Math.max(6, Math.min(W - w - 6, cx - w / 2));
  const by = Math.max(6, cy - h - 12);
  ctx.fillStyle = "rgba(28,24,32,.9)"; rr(bx, by, w, h, 12); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 7, by + h); ctx.lineTo(cx + 7, by + h); ctx.lineTo(cx, by + h + 9);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f6eef2";
  rows.forEach((r, i) => ctx.fillText(r, bx + w / 2, by + 12 + i * lh + (lh - 4) / 2));
  ctx.restore();
}
function prompt(x, y, t) {
  ctx.save();
  ctx.font = "600 12px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(t).width + 20;
  ctx.fillStyle = "rgba(28,24,32,.76)"; rr(x - w / 2, y, w, 22, 11); ctx.fill();
  ctx.fillStyle = "#ffe6f0"; ctx.fillText(t, x, y + 11.5);
  ctx.restore();
}

function drawHUD(now) {
  ctx.save();
  ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const head = "清泽 · " + HOME.roomName + " · " + String(HOME.doing).slice(0, 12);
  const w = ctx.measureText(head).width + 20;
  ctx.fillStyle = "rgba(28,24,32,.55)"; rr(10, 10, w, 22, 11); ctx.fill();
  ctx.fillStyle = "#f0e6ee"; ctx.fillText(head, 20, 21.5);

  const here = "你在 · " + ROOMS[cur].name;
  const w2 = ctx.measureText(here).width + 20;
  ctx.fillStyle = "rgba(255,214,150,.85)"; rr(W - 10 - w2, 10, w2, 22, 11); ctx.fill();
  ctx.fillStyle = "#3a2a16"; ctx.fillText(here, W - 10 - w2 + 10, 21.5);
  ctx.restore();

  ctx.fillStyle = "rgba(20,19,26,.92)"; ctx.fillRect(0, BAR_Y, W, H - BAR_Y);
  ctx.save();
  ctx.font = "500 10.5px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#9d94a6";
  ctx.fillText("小橘 · " + HOME.catRoom + " · " + String(HOME.catDoing).slice(0, 16), 16, BAR_Y + 10);
  ctx.fillStyle = "#cfc4d0"; ctx.fillText("家里的便条", 16, BAR_Y + 28);
  ctx.fillStyle = "#efe6f0";
  ctx.font = "500 12.5px -apple-system,PingFang SC,sans-serif";
  const note = HOME.note || "（还没留话）";
  ctx.fillText(note.slice(0, 26), 16, BAR_Y + 43);
  if (note.length > 26) ctx.fillText(note.slice(26, 52), 16, BAR_Y + 60);
  ctx.font = "500 10.5px -apple-system,PingFang SC,sans-serif";
  ctx.fillStyle = HOME.connected ? "#8fd0a0" : "#c9a06a";
  ctx.fillText(HOME.connected ? ("已连上 lh · " + HOME.source) : "没连上 lh · 用的是页面里自带的话", 16, H - 15);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(180,170,190,.7)";
  ctx.fillText("Tiles by LimeZu", W - 14, H - 15);
  ctx.restore();

  if (toastText && now < toastUntil) {
    ctx.save();
    ctx.font = "600 12px -apple-system,PingFang SC,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const t = toastText, w3 = ctx.measureText(t).width + 26;
    ctx.fillStyle = "rgba(255,214,150,.92)"; rr(W / 2 - w3 / 2, BAR_Y - 40, w3, 26, 13); ctx.fill();
    ctx.fillStyle = "#3a2a16"; ctx.fillText(t, W / 2, BAR_Y - 27);
    ctx.restore();
  }
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);

  ctx.clearRect(0, 0, W, H);
  drawRoom();
  drawFloorArt();

  const actors = [];
  for (const o of (ROOMS[cur].furn || [])) {
    actors.push({ y: o.y + o.h, f: () => { if (!drawTile(o)) drawGhostFurn(o); } });
  }
  if (HOME.catRoomId === cur) actors.push({ y: cat.y, f: () => drawCat(cat.x, cat.y) });
  if (HOME.roomId === cur)    actors.push({ y: qz.y,  f: () => drawQingze(qz.x, qz.y) });
  actors.push({ y: ning.y, f: () => drawNing(ning.x, ning.y) });
  actors.sort((a, b) => a.y - b.y).forEach(a => a.f());

  const dn = doorNear();
  if (dn && !bubble) prompt(dn.cx, WALL_Y + 10, "点门 · 去" + ROOMS[dn.id].name);

  if (bubble && now < bubbleUntil) {
    drawBubble((HOME.roomId === cur) ? qz.x : 180, (HOME.roomId === cur) ? qz.y - 92 : 150, bubble);
  }

  drawHUD(now);

  if (fade > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(fade, 1);
    ctx.fillStyle = "#0e0d12"; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
loadBackend();
</script>
