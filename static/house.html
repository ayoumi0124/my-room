<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>我们家 · v4.4</title>
<style>
  html,body{margin:0;height:100%;background:#14131a;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;
    font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;}

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
"use strict";
/* ============================================================
   我们家 · v4.4
   v4.0 颜色   v4.1 认 base.json   v4.2 落点/拆厨房门   v4.3 人永远在最上层

   v4.4（2026-10-12 晚）：摆了台面上的小东西。
     瓶子、油瓶、砧板、灶上的锅、桌上的碗碟 —— 它们本来就摆在台面／桌面上，
     可是下沿比台面高，按「谁靠下谁压上面」的规矩，一律被台面盖住。
     现在清单里给这类东西写一个 top:true，它们就画在所有家具之后、人之前。
     写在哪几件上：宁宁点名的那些，清泽在 base.json 里标。

   分三层画：
     ① 普通家具（按谁的下沿靠下谁压上面）
     ② top:true 的（台面上、桌面上的小东西）
     ③ 人（宁宁 / 清泽 / 小橘）—— 永远最上

   数据源：GET /home、/messages、/base.json
   素材：Tiles by LimeZu — https://limezu.itch.io/
   ============================================================ */

const W = 360, H = 640;
const WALL_Y = 150;
const FLOOR = { x0: 12, x1: 348, y0: WALL_Y, y1: 570 };
const BAR_Y = 570;
const LIVING_ID = "living";
const SPEED = 118;
const SPAWN = { x: 180, y: 260 };

const BASE = {
  in: "tiles/1_Interiors/32x32/Theme_Sorter_Singles_32x32/",
  ex: "tiles/Modern_Exteriors_32x32/ME_Theme_Sorter_32x32/"
};
const CATX = {
  living:    { b: "in", d: "2_Living_Room_Singles_32x32/",                        p: "Living_Room_Singles_32x32_" },
  bedroom:   { b: "in", d: "4_Bedroom_Singles_32x32/",                            p: "Bedroom_Singles_32x32_" },
  kitchen:   { b: "in", d: "12_Kitchen_Singles_32x32/",                           p: "Kitchen_Singles_32x32_" },
  classroom: { b: "in", d: "5_Classroom_and_Library_Singles_32x32/",              p: "Classroom_and_Library_Singles_32x32_" },
  japanese:  { b: "in", d: "20_Japanese_Interiors_Singles_32x32/",                p: "Japanese_Interiors_32x32_" },
  party:     { b: "in", d: "10_Birthday_Party_Singles_32x32/",                    p: "Birthday_Party_Singles_32x32_" },
  garden:    { b: "ex", d: "17_Garden_Singles_32x32/",                            p: "ME_Singles_Garden_32x32_" },
  terrain:   { b: "ex", d: "1_Terrains_and_Fences_Singles_32x32/",                p: "ME_Singles_Terrains_and_Fences_32x32_" }
};
const src = (c, n) => { const t = CATX[c]; if (!t) return ""; return BASE[t.b] + t.d + t.p + n + ".png"; };

const SHEET_DIRS = [
  "tiles/1_Interiors/32x32/Room_Bulder_subfiles_32x32/",
  "tiles/1_Interiors/32x32/Room_Builder_subfiles_32x32/"
];
const SHEET_DEF = {
  walls:  { file:"Room_Builder_Walls_32x32.png",         cols:32, rows:40 },
  floors: { file:"Room_Builder_Floors_32x32.png",        cols:15, rows:40 },
  shadow: { file:"Room_Builder_Floor_Shadows_32x32.png", cols:16, rows:5  },
  base:   { file:"Room_Builder_baseboards_32x32.png",    cols:6,  rows:6  }
};

const CG = "tiles/2_Characters/Character_Generator/";
const CELLW = 32, CELLH = 32;
const ROW_FRONT = 1;
const ROW_HAIRTOP = 0;
const DISP = 48;
const DIR = { left: 2, back: 1, right: 0, front: 3 };

const NING = {
  body:   "Bodies/32x32/Body_32x32_02.png",
  eyes:   "Eyes/32x32/Eyes_32x32_01.png",
  hair:   "Hairstyles/32x32/Hairstyle_28_32x32_01.png",
  outfit: "Outfit_13"
};
const QZ = {
  body:   "Bodies/32x32/Body_32x32_03.png",
  eyes:   "Eyes/32x32/Eyes_32x32_01.png",
  hair:   "Hairstyles/32x32/Hairstyle_18_32x32_01.png",
  outfit: "Outfit_02"
};

const OUTFITS = [];
for (let i = 1; i <= 33; i++) OUTFITS.push("Outfit_" + String(i).padStart(2, "0"));
let ningOutfitIdx = 12;
function outfitPath(key) { return "Outfits/32x32/" + key + "_32x32_01.png"; }

const IMG = Object.create(null);
function loadCG(u) {
  let e = IMG["#" + u];
  if (!e) {
    const im = new Image();
    e = IMG["#" + u] = { el: im, ok: false };
    im.onload = () => { e.ok = true; };
    im.onerror = () => { e.ok = false; };
    im.src = CG + u;
  }
  return e;
}
function loadTile(u) {
  if (!u) return { el:null, ok:false };
  let e = IMG["@" + u];
  if (!e) {
    const im = new Image();
    e = IMG["@" + u] = { el: im, ok: false };
    im.onload = () => { e.ok = true; };
    im.onerror = () => { e.ok = false; };
    im.src = u;
  }
  return e;
}
function img(c, n) { return loadTile(src(c, n)); }

const SHEETURL = Object.create(null);
function sheetUrl(k) {
  if (SHEETURL[k] !== undefined) return SHEETURL[k];
  SHEETURL[k] = null;
  const def = SHEET_DEF[k];
  if (!def) return null;
  let i = 0;
  (function tryNext() {
    if (i >= SHEET_DIRS.length) return;
    const u = SHEET_DIRS[i] + def.file;
    const im = new Image();
    im.onload  = () => { SHEETURL[k] = u; };
    im.onerror = () => { i++; tryNext(); };
    im.src = u;
  })();
  return null;
}

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

const ROOMS = {
  living:  { name:"客厅", wall:["#e3e7cf","#d5dbc0"], floor:["#e0c9a6","#d2b78e"], line:"rgba(150,112,70,.22)", plank:true,
             qz:{ x:170, y:330 }, cat:{ x:92, y:470 }, hideDoor:["kitchen"] },
  study:   { name:"书房", wall:["#e2e6d4","#d4dac5"], floor:["#dfc8a3","#d0b489"], line:"rgba(150,112,70,.22)", plank:true,
             qz:{ x:258, y:350 }, cat:{ x:300, y:470 }, hideDoor:[] },
  kitchen: { name:"厨房", wall:["#e8ecd6","#dbe0c7"], floor:["#e6d6bc","#d8c5a6"], line:"rgba(150,112,70,.20)", plank:true,
             qz:{ x:96, y:340 }, cat:{ x:300, y:468 }, hideDoor:[] },
  garden:  { name:"花园", wall:["#d8e6c6","#c6d9b0"], floor:["#a8c98a","#8fb772"], line:"rgba(70,110,50,.20)", plank:false,
             qz:{ x:180, y:330 }, cat:{ x:108, y:456 }, hideDoor:[] }
};
const ROOM_ORDER = ["living", "study", "kitchen", "garden"];
ROOM_ORDER.forEach(id => { ROOMS[id].bg = null; });

const REGION_ACTION = { "厨房":"做饭", "猫窝":"看小橘", "书房":"看书", "卧室":"休息", "餐桌":"吃饭" };
function actionOf(name) { return REGION_ACTION[name] || "进去看看"; }

const DOOR_W = 60, DOOR_H = 92, DOOR_Y = WALL_Y - DOOR_H;
const DOOR_XS = { 1:[150], 2:[80,240], 3:[22,150,278], 4:[12,116,220,324] };
function doorsOf(roomId) {
  const hid = ROOMS[roomId].hideDoor || [];
  const others = ROOM_ORDER.filter(id => id !== roomId && hid.indexOf(id) < 0);
  const xs = DOOR_XS[others.length] || DOOR_XS[3];
  return others.map((id, i) => ({ id, x: xs[i], cx: xs[i] + DOOR_W / 2, y: DOOR_Y, w: DOOR_W, h: DOOR_H }));
}

let ROOMLIST = ROOM_ORDER.map(id => ({ id, name: ROOMS[id].name }));
function resolveId(v) {
  if (!v) return "";
  if (ROOMS[v]) return v;
  const hit = ROOMLIST.find(r => r.name === v);
  return hit ? hit.id : v;
}
function nameOfId(id) {
  if (!id) return "";
  if (ROOMS[id]) return ROOMS[id].name;
  const hit = ROOMLIST.find(r => r.id === id);
  return hit ? hit.name : id;
}
function bgOf(id) { return ROOMS[id].bg || null; }
function wallColors(id) {
  const b = bgOf(id);
  if (b && b.wallTint) return [b.wallTint, b.wallTint];
  return ROOMS[id].wall;
}
function floorColors(id) {
  const b = bgOf(id);
  if (b && b.floorTint) return [b.floorTint, b.floorTint];
  return ROOMS[id].floor;
}
function regionsOf(id) { const b = bgOf(id); return (b && Array.isArray(b.regions)) ? b.regions : []; }
function furnOf(id)    { const b = bgOf(id); return (b && Array.isArray(b.items))   ? b.items   : []; }

function solidsOf(id) {
  return furnOf(id)
    .filter(o => o.solid === true)
    .map(o => ({ x:o.x + 4, y:o.y + o.h * 0.45, w:o.w - 8, h:o.h * 0.55 }));
}

const ning = { x: SPAWN.x, y: SPAWN.y, dir: "front", step: 0 };
const qz   = { x: 170, y: 330, dir: "front" };
const cat  = { x: 92,  y: 470, face: 1 };
let cur = LIVING_ID;

let HOME = {
  roomId: LIVING_ID, roomName: "客厅", doing: "在窗边站着，等你回来",
  catRoomId: LIVING_ID, catRoom: "客厅", catDoing: "趴在花丛边晒太阳",
  note: "阳台那盆薄荷记得浇水",
  connected: false, source: ""
};
let LINES = ["回来啦。", "今天的花收完了，卖了个好价。", "小橘刚在窗台上追光斑，扑了个空。"];
let LIVE_LINES = false;

const SOURCES      = ["./home", "/home", "home.json"];
const LINE_SOURCES = ["./messages", "/messages", "messages.json"];
const BASE_SOURCES = ["./base.json", "/base.json", "base.json"];

function applyHome(j) {
  if (!j || typeof j !== "object" || (!j.qingze && !j.rooms)) return false;
  if (Array.isArray(j.rooms) && j.rooms.length) ROOMLIST = j.rooms;
  const q = j.qingze || {}, c = j.cat || {};
  const rid = resolveId(q.at);
  if (rid) HOME.roomId = rid;
  HOME.roomName = nameOfId(HOME.roomId) || HOME.roomName;
  if (q.doing) HOME.doing = q.doing;
  const cid = resolveId(c.at);
  if (cid) HOME.catRoomId = cid;
  HOME.catRoom = nameOfId(HOME.catRoomId) || HOME.catRoom;
  if (c.doing) HOME.catDoing = c.doing;
  if (typeof j.note === "string" && j.note.trim()) HOME.note = j.note.trim();
  HOME.connected = true;
  return true;
}
function applyLines(j) {
  const arr = Array.isArray(j) ? j : (j && Array.isArray(j.messages) ? j.messages : null);
  if (!arr || !arr.length) return false;
  const out = [];
  for (const it of arr) {
    const t = typeof it === "string" ? it : (it && (it.text || it.msg || it.content));
    if (typeof t === "string" && t.trim()) out.push(t.trim());
  }
  if (!out.length) return false;
  LINES = out.slice(-20).reverse();
  LIVE_LINES = true;
  return true;
}
function applyBase(j) {
  if (!j || typeof j !== "object" || !j.rooms) return false;
  Object.keys(j.rooms).forEach(id => {
    if (!ROOMS[id]) return;
    const r = j.rooms[id] || {};
    ROOMS[id].bg = {
      wallTint:  r.wallTint  || null,
      floorTint: r.floorTint || null,
      regions:   Array.isArray(r.regions) ? r.regions : [],
      items:     Array.isArray(r.items)   ? r.items   : []
    };
    (ROOMS[id].bg.regions || []).forEach(g => { if (g.floor) sheetUrl(g.floor.s); });
    (ROOMS[id].bg.items || []).forEach(o => img(o.c, o.n));
  });
  return true;
}
async function tryGet(url) {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1800);
    const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
    clearTimeout(t);
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
async function loadBackend() {
  for (const u of BASE_SOURCES) { const j = await tryGet(u); if (j && applyBase(j)) break; }
  for (const u of SOURCES)      { const j = await tryGet(u); if (j && applyHome(j))  { HOME.source = u; break; } }
  for (const u of LINE_SOURCES) { const j = await tryGet(u); if (j && applyLines(j)) { HOME.source = u; break; } }
}

function ningOutfit() { return OUTFITS[ningOutfitIdx % OUTFITS.length]; }

(function preload() {
  ["body", "eyes", "hair"].forEach(k => { loadCG(NING[k]); loadCG(QZ[k]); });
  OUTFITS.forEach(o => loadCG(outfitPath(o)));
  Object.keys(SHEET_DEF).forEach(k => sheetUrl(k));
})();

const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width  = Math.round(W * s) + "px";
  cv.style.height = Math.round(H * s) + "px";
  cv.width  = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));

function blocked(x, y) {
  if (x < FLOOR.x0 + 9 || x > FLOOR.x1 - 9) return true;
  if (y < FLOOR.y0 + 4 || y > FLOOR.y1 - 2) return true;
  for (const o of solidsOf(cur)) {
    if (x > o.x - 7 && x < o.x + o.w + 7 && y > o.y - 2 && y < o.y + o.h + 8) return true;
  }
  return false;
}

let fade = 0, pending = null;
function gotoRoom(id) { if (id !== cur && !pending) pending = id; }
function doSwitch(id) {
  cur = id;
  ning.x = SPAWN.x; ning.y = SPAWN.y; ning.step = 0; ning.dir = "front";
  qz.x = ROOMS[id].qz.x;   qz.y = ROOMS[id].qz.y; qz.dir = "front";
  cat.x = ROOMS[id].cat.x; cat.y = ROOMS[id].cat.y;
  target = null;
}

const keys = Object.create(null);
addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); mainAction(); }
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key) >= 0) e.preventDefault();
});
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

function toWorld(cx, cy) {
  const r = cv.getBoundingClientRect();
  return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H };
}
let target = null, pressing = false;
cv.addEventListener("pointerdown", (e) => {
  const p = toWorld(e.clientX, e.clientY);
  e.preventDefault();
  if (pending) return;
  if (onNing(p)) { ningOutfitIdx++; toast("换衣服啦 · " + ningOutfit()); return; }
  if (nearQz(p)) { tryTalk(); return; }
  if (regionPrompt && inRect(p, regionPrompt)) { enterRegion(regionPrompt.region); return; }
  const d = doorUnder(p);
  if (d) { gotoRoom(d.id); return; }
  pressing = true; target = p;
});
cv.addEventListener("pointermove", (e) => {
  if (!pressing) return;
  target = toWorld(e.clientX, e.clientY); e.preventDefault();
});
const release = () => { pressing = false; target = null; };
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("pointerleave", release);

function inRect(p, r) { return p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h; }
function onNing(p) { return Math.abs(p.x - ning.x) < 26 && p.y > ning.y - 100 && p.y < ning.y + 8; }
function nearQz(p) { return HOME.roomId === cur && Math.abs(p.x - qz.x) < 30 && p.y > qz.y - 100 && p.y < qz.y + 14; }
function doorUnder(p) {
  if (p.y > WALL_Y + 22) return null;
  for (const d of doorsOf(cur)) if (p.x > d.x - 10 && p.x < d.x + d.w + 10) return d;
  return null;
}
function doorNear() {
  for (const d of doorsOf(cur)) if (ning.y < WALL_Y + 62 && Math.abs(ning.x - d.cx) < 42) return d;
  return null;
}
function regionUnderFeet() {
  const regs = regionsOf(cur);
  for (let i = regs.length - 1; i >= 0; i--) {
    const g = regs[i];
    if (ning.x >= g.x && ning.x <= g.x + g.w && ning.y >= g.y && ning.y <= g.y + g.h) return g;
  }
  return null;
}
let regionPrompt = null;
function mainAction() {
  const g = regionUnderFeet();
  if (g) { enterRegion(g); return; }
  tryTalk();
}
function enterRegion(g) {
  say(g.name + "这块清泽还在写，" + actionOf(g.name) + "的界面过两天才有。不过他记下了。", 4200);
}

let bubble = null, bubbleUntil = 0, lineIdx = 0;
function say(t, ms) { bubble = t; bubbleUntil = performance.now() + (ms || 3600); }
function tryTalk() {
  const g = regionUnderFeet();
  if (g) { enterRegion(g); return; }
  if (HOME.roomId !== cur) { say("清泽在" + HOME.roomName + "，" + HOME.doing + "。你上那边找他。"); return; }
  if (Math.hypot(ning.x - qz.x, ning.y - qz.y) > 84) { say("你走近点，清泽听不见。", 2200); return; }
  say(String(LINES[lineIdx % LINES.length]).slice(0, 90), 4200);
  lineIdx++;
}
let toastText = "", toastUntil = 0;
function toast(t) { toastText = t; toastUntil = performance.now() + 1800; }

let last = performance.now();
function update(dt) {
  if (pending) {
    fade = Math.min(1, fade + dt * 3.6);
    if (fade >= 1) { doSwitch(pending); pending = null; }
  } else if (fade > 0) {
    fade = Math.max(0, fade - dt * 3.6);
  }

  let dx = 0, dy = 0;
  if (keys["arrowleft"] || keys["a"]) dx -= 1;
  if (keys["arrowright"]|| keys["d"]) dx += 1;
  if (keys["arrowup"]   || keys["w"]) dy -= 1;
  if (keys["arrowdown"] || keys["s"]) dy += 1;

  if (!dx && !dy && target) {
    const tx = target.x - ning.x, ty = target.y - ning.y;
    const d = Math.hypot(tx, ty);
    if (d < 7) target = null; else { dx = tx / d; dy = ty / d; }
  }
  const len = Math.hypot(dx, dy);
  const walking = len > 0;
  if (walking) {
    dx /= len; dy /= len;
    const sx = dx * SPEED * dt, sy = dy * SPEED * dt;
    if (!blocked(ning.x + sx, ning.y)) ning.x += sx;
    if (!blocked(ning.x, ning.y + sy)) ning.y += sy;
    if (Math.abs(dx) > 0.35) ning.dir = dx > 0 ? "right" : "left";
    else if (dy < -0.35) ning.dir = "back";
    else if (dy > 0.35) ning.dir = "front";
    ning.step += dt * 9;
  } else ning.step = 0;

  if (HOME.catRoomId === cur) {
    const cx = ning.x - cat.x, cy = ning.y - cat.y + 6;
    const cd = Math.hypot(cx, cy);
    if (cd > 72) {
      const step = 42 * dt;
      const nx = cat.x + cx / cd * step, ny = cat.y + cy / cd * step;
      if (!blocked(nx, ny)) { cat.x = nx; cat.y = ny; }
    }
    cat.face = ning.x >= cat.x ? 1 : -1;
  }

  if (HOME.roomId === cur) {
    const ddx = ning.x - qz.x;
    const distant = Math.hypot(ddx, ning.y - qz.y);
    if (Math.abs(ddx) < 9) qz.dir = "front";
    else qz.dir = ddx > 0 ? "right" : "left";
    if (!walking && distant < 84) {
      const ndx = qz.x - ning.x;
      if (Math.abs(ndx) < 9) ning.dir = "front";
      else ning.dir = ndx > 0 ? "right" : "left";
    }
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function shadow(x, y, rx, ry) {
  ctx.save(); ctx.globalAlpha = .18; ctx.fillStyle = "#2a1f16";
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawTile(o) {
  const e = img(o.c, o.n);
  if (!e.ok) return false;
  const im = e.el;
  if (o.stretch) { ctx.drawImage(im, o.x, o.y, o.w, o.h); return true; }
  const iw = im.naturalWidth  || 32;
  const ih = im.naturalHeight || 32;
  const w = o.w;
  const h = w * ih / iw;
  ctx.drawImage(im, o.x + (o.w - w) / 2, o.y + o.h - h, w, h);
  return true;
}

const BLANK = Object.create(null);
function blankCell(key, c, r) {
  const table = BLANK[key];
  if (!table) return false;
  return table[r * SHEET_DEF[key].cols + c] === 1;
}
function scanBlank(key) {
  if (BLANK[key] !== undefined) return;
  BLANK[key] = null;
  const def = SHEET_DEF[key];
  const u = sheetUrl(key);
  if (!u) return;
  const im = new Image();
  im.onload = () => {
    try {
      const t = document.createElement("canvas");
      t.width = def.cols * 32; t.height = def.rows * 32;
      const g = t.getContext("2d");
      g.imageSmoothingEnabled = false;
      g.drawImage(im, 0, 0, t.width, t.height);
      const pix = g.getImageData(0, 0, t.width, t.height).data;
      const W2 = t.width;
      const out = new Uint8Array(def.cols * def.rows);
      const hist = new Int32Array(256);
      for (let r = 0; r < def.rows; r++) {
        for (let c = 0; c < def.cols; c++) {
          hist.fill(0);
          for (let y = 0; y < 32; y++) {
            let idx = ((r * 32 + y) * W2 + c * 32) * 4;
            for (let x = 0; x < 32; x++, idx += 4) {
              hist[Math.max(pix[idx], pix[idx+1], pix[idx+2])]++;
            }
          }
          let acc = 0, p2 = 0, p98 = 255;
          for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= 20) { p2 = v; break; } }
          acc = 0;
          for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= 20) { p98 = v; break; } }
          if ((p98 - p2) < 26 && (p98 < 78 || p2 > 188)) out[r * def.cols + c] = 1;
        }
      }
      BLANK[key] = out;
    } catch (e) { BLANK[key] = new Uint8Array(def.cols * def.rows); }
  };
  im.onerror = () => { BLANK[key] = new Uint8Array(def.cols * def.rows); };
  im.src = u;
}

function tileRect(t, x0, y0, x1, y1) {
  if (!t) return false;
  const def = SHEET_DEF[t.s];
  if (!def) return false;
  const u = sheetUrl(t.s);
  if (!u) return false;
  const e = loadTile(u);
  if (!e.ok) return false;

  const wArea = x1 - x0, hArea = y1 - y0;
  let tw = 32, th = 32;
  if (t.fit) {
    const cols = Math.max(1, Math.round(wArea / 32));
    const rows = Math.max(1, Math.round(hArea / 32));
    tw = wArea / cols;
    th = hArea / rows;
  }
  const lc = Math.max(1, t.lc || 1);
  const lr = Math.max(1, t.lr || 1);
  const nCols = Math.ceil(wArea / tw);
  const nRows = Math.ceil(hArea / th);

  let lastC = t.c, lastR = t.r;
  for (let j = 0; j < nRows; j++) {
    for (let i = 0; i < nCols; i++) {
      let col = (t.c + (i % lc)) % def.cols;
      let row = (t.r + (j % lr)) % def.rows;
      if (t.clean && blankCell(t.s, col, row)) { col = lastC; row = lastR; }
      else { lastC = col; lastR = row; }

      const dx = x0 + i * tw, dy = y0 + j * th;
      const dw = Math.min(tw, x1 - dx), dh = Math.min(th, y1 - dy);
      ctx.drawImage(e.el, col * 32, row * 32, dw, dh, dx, dy, dw, dh);
    }
  }
  return true;
}

function piece(u, row, col, lift, x, y) {
  const e = loadCG(u);
  if (!e.ok) return false;
  ctx.drawImage(e.el, col * CELLW, row * CELLH, CELLW, CELLH,
    x - DISP / 2, y - DISP * (1 + lift), DISP, DISP);
  return true;
}
function drawPerson(P, outfitKey, dir, x, y, bob) {
  const c = DIR[dir] === undefined ? DIR.front : DIR[dir];
  ctx.save();
  ctx.translate(0, bob || 0);
  piece(P.body, ROW_FRONT, c, 0, x, y);
  piece(P.eyes, ROW_FRONT, c, 0, x, y);
  if (outfitKey) piece(outfitPath(outfitKey), ROW_FRONT, c, 0, x, y);
  piece(P.hair, ROW_HAIRTOP, c, 1, x, y);
  piece(P.hair, ROW_FRONT, c, 0, x, y);
  ctx.restore();
}
function drawNing(bob) {
  shadow(ning.x, ning.y, 12, 4);
  drawPerson(NING, ningOutfit(), ning.dir, ning.x, ning.y, bob);
  tag(ning.x, ning.y - 100, "宁宁", true);
}
function drawQz() {
  shadow(qz.x, qz.y, 13, 4);
  drawPerson(QZ, QZ.outfit, qz.dir, qz.x, qz.y, 0);
  tag(qz.x, qz.y - 100, "清泽", false);
}
function drawCat(x, y) {
  shadow(x, y, 9, 3);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "#e2913f";
  ctx.beginPath(); ctx.ellipse(0, -8, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cat.face * 9, -14, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cat.face * 5, -19); ctx.lineTo(cat.face * 8, -25); ctx.lineTo(cat.face * 11, -18);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cat.face * 11, -19); ctx.lineTo(cat.face * 14, -25); ctx.lineTo(cat.face * 15, -17);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#e2913f"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-cat.face * 9, -7);
  ctx.quadraticCurveTo(-cat.face * 20, -12, -cat.face * 17, -20); ctx.stroke();
  ctx.fillStyle = "#2a2220";
  ctx.beginPath(); ctx.arc(cat.face * 7, -15, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cat.face * 11.5, -15, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function tag(x, y, text, pink) {
  ctx.save();
  ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 14;
  ctx.fillStyle = "rgba(28,24,32,.68)"; rr(x - w / 2, y - 9, w, 18, 9); ctx.fill();
  ctx.fillStyle = pink ? "#ffd9e8" : "#cfe1f5";
  ctx.fillText(text, x, y + .5);
  ctx.restore();
}
function drawBubble(cx, cy, text) {
  ctx.save();
  ctx.font = "500 12px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const maxW = 244, rows = []; let c0 = "";
  for (const ch of String(text)) {
    if (ctx.measureText(c0 + ch).width > maxW - 22) { rows.push(c0); c0 = ch; } else c0 += ch;
  }
  if (c0) rows.push(c0);
  const lh = 17;
  const w = Math.min(maxW, Math.max.apply(null, rows.map(r => ctx.measureText(r).width)) + 22);
  const h = rows.length * lh + 16;
  const bx = Math.max(6, Math.min(W - w - 6, cx - w / 2));
  const by = Math.max(6, cy - h - 12);
  ctx.fillStyle = "rgba(28,24,32,.9)"; rr(bx, by, w, h, 12); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 7, by + h); ctx.lineTo(cx + 7, by + h); ctx.lineTo(cx, by + h + 9);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f6eef2";
  rows.forEach((r, i) => ctx.fillText(r, bx + w / 2, by + 12 + i * lh + (lh - 4) / 2));
  ctx.restore();
}
function pill(x, y, w, h, bg, fg, text) {
  ctx.save();
  ctx.font = "600 12px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = bg; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.fillText(text, x + w / 2, y + h / 2 + .5);
  ctx.restore();
}

function drawWall() {
  const wc = wallColors(cur);
  const g = ctx.createLinearGradient(0, 0, 0, WALL_Y);
  g.addColorStop(0, wc[0]); g.addColorStop(1, wc[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, WALL_Y);

  ctx.fillStyle = "rgba(90,80,60,.07)";
  ctx.fillRect(0, 0, W, 6);

  for (const px of [90, 216]) {
    ctx.fillStyle = "#b9a07c";
    ctx.fillRect(px, 26, 54, 40);
    ctx.fillStyle = cur === "garden" ? "#dcecc8" : "#e4eef2";
    ctx.fillRect(px + 5, 31, 44, 30);
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(px + 20, 44, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(120,100,75,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px + 27, 31); ctx.lineTo(px + 27, 61); ctx.stroke();
  }

  ctx.fillStyle = "rgba(60,50,35,.12)";
  ctx.fillRect(0, WALL_Y - 6, W, 6);
}

function drawFloor() {
  const fc = floorColors(cur);
  const R  = ROOMS[cur];
  const g = ctx.createLinearGradient(0, WALL_Y, 0, FLOOR.y1);
  g.addColorStop(0, fc[0]); g.addColorStop(1, fc[1]);
  ctx.fillStyle = g; ctx.fillRect(0, WALL_Y, W, FLOOR.y1 - WALL_Y);

  ctx.save();
  ctx.strokeStyle = R.line; ctx.lineWidth = 1;
  if (R.plank) {
    const pk = 34;
    for (let y = WALL_Y + pk; y < FLOOR.y1; y += pk) {
      ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
    }
    let band = 0;
    for (let y = WALL_Y; y < FLOOR.y1; y += pk, band++) {
      const off = (band % 2) ? 48 : 0;
      const y2 = Math.min(y + pk, FLOOR.y1);
      for (let x = off; x < W; x += 96) {
        ctx.beginPath(); ctx.moveTo(x + .5, y); ctx.lineTo(x + .5, y2); ctx.stroke();
      }
    }
  } else {
    ctx.strokeStyle = "rgba(70,110,50,.18)";
    for (let y = WALL_Y + 18; y < FLOOR.y1; y += 26) {
      for (let x = 10 + ((y / 26) % 2) * 13; x < W; x += 27) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 2, y - 5); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 4, y); ctx.lineTo(x + 3, y - 4); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawRegions() {
  const regs = regionsOf(cur);
  for (let i = regs.length - 1; i >= 0; i--) {
    const g = regs[i];
    const ok = g.floor ? tileRect(g.floor, g.x, g.y, g.x + g.w, g.y + g.h) : false;
    if (!ok && g.tint) { ctx.fillStyle = g.tint; ctx.fillRect(g.x, g.y, g.w, g.h); }
  }
}

function drawRoom() {
  drawWall();

  const near = doorNear();
  for (const d of doorsOf(cur)) {
    const hot = near && near.id === d.id;
    ctx.fillStyle = "#8a6a4c"; rr(d.x, d.y, d.w, d.h, 4); ctx.fill();
    ctx.fillStyle = hot ? "#d8b184" : "#b08a63";
    rr(d.x + 5, d.y + 5, d.w - 10, d.h - 5, 3); ctx.fill();
    ctx.fillStyle = "#e8d6a8";
    ctx.beginPath(); ctx.arc(d.x + d.w - 10, d.y + 52, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const nm = ROOMS[d.id].name, tw = ctx.measureText(nm).width + 16;
    ctx.fillStyle = hot ? "rgba(255,214,150,.95)" : "rgba(28,24,32,.6)";
    rr(d.cx - tw / 2, d.y - 20, tw, 17, 8); ctx.fill();
    ctx.fillStyle = hot ? "#3a2a16" : "#f2e8dd";
    ctx.fillText(nm, d.cx, d.y - 11.5);
    ctx.restore();
  }

  drawFloor();
  drawRegions();
}

function drawHUD(now) {
  ctx.save();
  ctx.font = "600 11px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  const head = "清泽 · " + HOME.roomName + " · " + String(HOME.doing).slice(0, 12);
  const w = ctx.measureText(head).width + 20;
  ctx.fillStyle = "rgba(28,24,32,.55)"; rr(10, 10, w, 22, 11); ctx.fill();
  ctx.fillStyle = "#f0e6ee"; ctx.fillText(head, 20, 21.5);

  const here = "你在 · " + ROOMS[cur].name;
  const w2 = ctx.measureText(here).width + 20;
  ctx.fillStyle = "rgba(255,214,150,.85)"; rr(W - 10 - w2, 10, w2, 22, 11); ctx.fill();
  ctx.fillStyle = "#3a2a16"; ctx.fillText(here, W - 10 - w2 + 10, 21.5);
  ctx.restore();

  ctx.fillStyle = "rgba(20,19,26,.92)"; ctx.fillRect(0, BAR_Y, W, H - BAR_Y);
  ctx.save();
  ctx.font = "500 10.5px -apple-system,PingFang SC,sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#9d94a6";
  ctx.fillText("小橘 · " + HOME.catRoom + " · " + String(HOME.catDoing).slice(0, 16), 16, BAR_Y + 10);
  ctx.fillStyle = "#cfc4d0"; ctx.fillText("家里的便条", 16, BAR_Y + 28);
  ctx.fillStyle = "#efe6f0";
  ctx.font = "500 12.5px -apple-system,PingFang SC,sans-serif";
  const note = HOME.note || "（还没留话）";
  ctx.fillText(note.slice(0, 26), 16, BAR_Y + 43);
  if (note.length > 26) ctx.fillText(note.slice(26, 52), 16, BAR_Y + 60);
  ctx.font = "500 10.5px -apple-system,PingFang SC,sans-serif";
  ctx.fillStyle = HOME.connected ? "#8fd0a0" : "#c9a06a";
  ctx.fillText(HOME.connected ? ("已连上 lh · " + HOME.source) : "没连上 lh · 用的是页面里自带的话", 16, H - 15);
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(180,170,190,.7)";
  ctx.fillText("Tiles by LimeZu", W - 14, H - 15);
  ctx.restore();

  if (toastText && now < toastUntil) {
    ctx.save();
    ctx.font = "600 12px -apple-system,PingFang SC,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const t = toastText, w3 = ctx.measureText(t).width + 26;
    ctx.fillStyle = "rgba(255,214,150,.92)"; rr(W / 2 - w3 / 2, BAR_Y - 40, w3, 26, 13); ctx.fill();
    ctx.fillStyle = "#3a2a16"; ctx.fillText(t, W / 2, BAR_Y - 27);
    ctx.restore();
  }
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);

  ctx.clearRect(0, 0, W, H);
  drawRoom();

  const bob = ning.step > 0 ? Math.sin(ning.step * 2) * 1.6 : 0;

  /* 第一层：普通家具 —— 谁的下沿靠下谁压上面 */
  const items = furnOf(cur);
  const low = [], high = [];
  for (let i = 0; i < items.length; i++) {
    const o = items[i];
    (o.top === true ? high : low).push({ y: o.y + o.h, i: i, f: () => drawTile(o) });
  }
  const byDepth = (a, b) => (a.y - b.y) || (a.i - b.i);
  low.sort(byDepth).forEach(a => a.f());

  /* 第二层：台面上、桌面上的小东西 —— 点名 top:true 的，压在所有大家具上头 */
  high.sort(byDepth).forEach(a => a.f());

  /* 第三层：人。永远最上。 */
  if (HOME.catRoomId === cur) drawCat(cat.x, cat.y);
  if (HOME.roomId === cur)    drawQz();
  drawNing(bob);

  regionPrompt = null;
  const g = regionUnderFeet();
  if (g && !pending) {
    const label = g.name + " · 按一下" + actionOf(g.name);
    ctx.save();
    ctx.font = "600 12px -apple-system,PingFang SC,sans-serif";
    const tw = ctx.measureText(label).width + 22;
    ctx.restore();
    const px = Math.round(W / 2 - tw / 2), py = BAR_Y - 46, ph = 26;
    pill(px, py, tw, ph, "rgba(255,214,150,.94)", "#3a2a16", label);
    regionPrompt = { x: px, y: py, w: tw, h: ph, region: g };
  }

  const dn = doorNear();
  if (dn && !bubble && !regionPrompt) pill(dn.cx - 70, WALL_Y + 10, 140, 22,
      "rgba(28,24,32,.76)", "#ffe6f0", "点门 · 去" + ROOMS[dn.id].name);

  if (bubble && now < bubbleUntil) {
    drawBubble((HOME.roomId === cur) ? qz.x : 180, (HOME.roomId === cur) ? qz.y - 112 : 150, bubble);
  }

  drawHUD(now);

  if (fade > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(fade, 1);
    ctx.fillStyle = "#0e0d12"; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
loadBackend();
scanBlank("floors");
</script>
</body>
